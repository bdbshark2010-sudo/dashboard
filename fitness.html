<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Fitness Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--card-bg:#0a0a0f;--card-border:rgba(249,115,22,0.10);--mint:#F97316;--mint-dim:rgba(249,115,22,0.45);--amber:#fbbf24;--red:#f87171;--text:#fff;--o:#F97316;--o-dim:rgba(249,115,22,0.45)}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body{max-width:480px;margin:0 auto;padding:60px 20px 100px;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px at 25% 15%,rgba(249,115,22,.06) 0%,transparent 70%);animation:amb 24s ease-in-out infinite alternate}
@keyframes amb{0%{transform:translate(0,0)scale(1)}25%{transform:translate(20px,-10px)scale(1.01)}50%{transform:translate(-15px,15px)scale(.99)}75%{transform:translate(10px,-20px)scale(1.02)}100%{transform:translate(-15px,8px)scale(.98)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp 600ms ease-out backwards}
.divider{display:flex;align-items:center;gap:16px;margin-bottom:24px}.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.10)}.divider span{font-size:11px;letter-spacing:0.22em;color:rgba(255,255,255,0.85);font-weight:500}
.label{font-size:10px;letter-spacing:0.22em;color:rgba(255,255,255,0.55);font-weight:500;text-transform:uppercase;margin-bottom:6px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;padding:22px;margin-bottom:16px;display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text);cursor:pointer;transition:border-color 0.2s,transform 0.15s}
.card:active{transform:scale(0.98)}
.card-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.card-icon.g{background:rgba(249,115,22,0.10)}
.card-icon.b{background:rgba(59,130,246,0.10)}
.card-icon.y{background:rgba(251,191,36,0.10)}
.card-body{flex:1;min-width:0}
.card-title{font-size:16px;font-weight:600;margin-bottom:2px;letter-spacing:-0.02em}
.card-sub{font-size:12px;color:rgba(255,255,255,0.55);font-weight:500}
.card-stat{font-size:22px;font-weight:600;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;margin-top:6px}
.card-stat.s{font-size:13px}
.card-arrow{color:var(--mint);font-size:20px;flex-shrink:0;opacity:0.6}
/* sync */
.sb{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:10px;background:var(--card-bg);border:1px solid var(--card-border);font-size:10px;font-family:ui-monospace,"SF Mono",Menlo,monospace;margin-bottom:20px}
.sb-d{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-d.g{background:var(--mint)}.sb-d.r{background:var(--red)}.sb-d.y{background:var(--amber)}
.sb-t{flex:1;color:rgba(255,255,255,0.35)}
/* tab bar */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 16px calc(8px+env(safe-area-inset-bottom));pointer-events:none}
.tb-in{pointer-events:auto;display:flex;width:100%;max-width:430px;gap:3px;padding:5px;background:rgba(10,10,13,0.92);border:1px solid rgba(255,255,255,0.08);border-radius:18px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 8px 40px rgba(0,0,0,0.65),inset 0 1px 0 rgba(255,255,255,0.04)}
.tb-t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.35);text-decoration:none;transition:all 250ms}
.tb-t.a{color:#fff;background:rgba(255,255,255,0.05);position:relative}
.tb-t.a::after{content:'';position:absolute;top:1px;left:25%;right:25%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--mint),rgba(249,115,22,0.40))}
.tb-t-icon{font-size:16px;line-height:1}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(255,255,255,0.10);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--text);padding:14px 22px;border-radius:999px;font-size:14px;font-weight:500;z-index:400;opacity:0;pointer-events:none;transition:opacity 0.2s,transform 0.2s;border:1px solid rgba(255,255,255,0.08);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
</style>
<script src="js/sync.js"></script>
</head>
<body>

<div class="divider fade"><span>FITNESS HUB</span></div>

<div class="sb fade" style="animation-delay:40ms">
<div class="sb-d g" id="sbDot"></div>
<span class="sb-t" id="sbText">Connected</span>
</div>

<a class="card fade" href="gym.html" style="animation-delay:80ms">
<div class="card-icon g">&#x1F3CB;</div>
<div class="card-body">
<div class="label">Progressive Overload</div>
<div class="card-title">Gym Coach</div>
<div class="card-sub" id="gymSub">Loading...</div>
<div class="card-stat" id="gymStat" style="color:var(--mint);font-size:15px">—</div>
</div>
<span class="card-arrow">&#x2192;</span>
</a>

<a class="card fade" href="water.html" style="animation-delay:120ms">
<div class="card-icon b">&#x1F4A7;</div>
<div class="card-body">
<div class="label">Weight-Based</div>
<div class="card-title">Water Coach</div>
<div class="card-sub" id="waterSub">Loading...</div>
<div class="card-stat" id="waterStat">—</div>
</div>
<span class="card-arrow">&#x2192;</span>
</a>

<a class="card fade" href="sleep.html" style="animation-delay:160ms">
<div class="card-icon y">&#x1F319;</div>
<div class="card-body">
<div class="label">Rest & Recovery</div>
<div class="card-title">Sleep Tracker</div>
<div class="card-sub" id="sleepSub">Loading...</div>
<div class="card-stat" id="sleepStat">—</div>
</div>
<span class="card-arrow">&#x2192;</span>
</a>

<nav class="tb"><div class="tb-in"><a class="tb-t" href="index.html"><span class="tb-t-icon">&#x1F3E0;</span>Home</a><a class="tb-t" href="planner.html"><span class="tb-t-icon">&#x1F9F0;</span>Plan</a><a class="tb-t a" href="fitness.html"><span class="tb-t-icon">&#x1F4AA;</span>Fit</a><a class="tb-t" href="calendar.html"><span class="tb-t-icon">&#x1F4C5;</span>Cal</a><a class="tb-t" href="finance.html"><span class="tb-t-icon">&#x1F4B0;</span>Fin</a><a class="tb-t" href="focus.html"><span class="tb-t-icon">&#x1F3AF;</span>Focus</a><a class="tb-t" href="study.html"><span class="tb-t-icon">&#x1F4DA;</span>Study</a></div></nav>

<div class="toast" id="toast"></div>

<script>
function gk(k){return window.syncGet?syncGet(k):(function(){try{return JSON.parse(localStorage.getItem(k))}catch{return null}})()}

function td(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dd(n){return n.toFixed(1)}
function wkAvg(a){if(!a||!a.length)return 0;var s=0,c=0;for(var i=Math.max(0,a.length-7);i<a.length;i++){s+=a[i];c++}return c?s/c:0}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}

function renderHub(){
  // Gym - read from po_coach_v1
  var gd=gk('po_coach_v1')||{}
  var gs=document.getElementById('gymStat'),gSub=document.getElementById('gymSub')
  if(gd.splitRotation&&gd.splitAnchor){
    var rot=gd.splitRotation,a=new Date(gd.splitAnchor.date);a.setHours(0,0,0,0)
    var t=new Date();t.setHours(0,0,0,0)
    var diff=Math.round((t-a)/86400000)
    var idx=((gd.splitAnchor.index+diff)%rot.length+rot.length)%rot.length
    var nm=rot[idx],ir=/^rest\b/i.test(nm||'')
    gs.textContent=ir?'REST':nm.toUpperCase()
    gs.style.color=ir?'#3B82F6':'var(--mint)'
    gSub.textContent=ir?'Recovery day':'Training day'
  }else{
    gs.textContent='Set up split'
    gSub.textContent='Tap to configure'
  }

  // Water - read from po_water_v1
  var wd=gk('po_water_v1')||{}
  var wk=td(),wc=wd.logs?wd.logs[wk]||0:0
  var wp=wd.profile||{},wKg=wd.weightUnit==='lb'?wp.weightKg/2.20462:(wp.weightKg||54)
  var unitVol=wd.unit==='bottle'?(wd.bottleMl||1000):wd.unit==='glass'?(wd.glassMl||250):wd.unit==='oz'?30:1
  var wBase=wKg*35+(wp.sex==='m'?200:0)+(wd.customTargetMl>0?0:((wp.activityHrsPerWeek||0)/7*500+Math.max(0,((wd.caffeineMgPerDay||200)-200)*1.5)))
  var wTargetMl=wd.customTargetMl>0?wd.customTargetMl:wBase+200
  var target=Math.ceil(wTargetMl/unitVol)
  document.getElementById('waterStat').textContent=wc+' / '+target
  document.getElementById('waterSub').textContent=wc+' '+(wd.unit||'bottle')+(wc===1?'':'s')+' today'

  // Sleep - read from sleep_log
  var sl=gk('sleep_log')||{},sy=td(),sn=sl[sy]
  var sStat=document.getElementById('sleepStat'),sSub=document.getElementById('sleepSub')
  if(sn&&sn.bed&&sn.wake){
    var bp=sn.bed.split(':').map(Number),wp=sn.wake.split(':').map(Number)
    var h=wp[0]-bp[0],m=wp[1]-bp[1];if(h<0||(h===0&&m<0))h+=24
    var hrs=+(h+m/60).toFixed(1)
    sStat.textContent=hrs+'h';sSub.textContent=sn.bed+' → '+sn.wake
    sStat.style.color=hrs>=8?'var(--mint)':hrs>=5?'var(--amber)':'var(--red)'
  }else{
    sStat.textContent='—';sSub.textContent='No data for today'
  }
}

document.addEventListener('DOMContentLoaded',async function(){
  if(window.syncInit)await syncInit()
  // Normalize po_water_v1 data (migrate old defaults)
  const _r=gk('po_water_v1');
  if(_r){let _c=false;
    if(_r.bottleMl>0&&Number(_r.bottleMl)<=500){_r.bottleMl=1000;_c=true}
    if(_r.profile&&_r.profile.weightKg>0&&Number(_r.profile.weightKg)<=75){_r.profile.weightKg=54;_c=true}
    if(_c)sk('po_water_v1',_r)
  }
  renderHub()
})
</script>
</body>
</html>
