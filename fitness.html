<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Fitness & Recovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="js/sync.js"></script>
<style>
:root{--bg:#000;--s:rgba(255,255,255,.045);--b:rgba(255,255,255,.07);--t1:#F5F4F0;--t2:#B0ADA7;--t3:#6E6B66;--c1:#F97316;--c2:#3B82F6;--g:#22C55E;--y:#F59E0B;--r:#EF4444;--f:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;--fh:'Space Grotesk',-apple-system,sans-serif;--m:ui-monospace,'SF Mono',Menlo,monospace;--br:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);font-family:var(--f);padding:20px 14px 88px;min-height:100vh;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px at 30% 10%,rgba(249,115,22,.07) 0%,transparent 65%)}
@keyframes fI{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
.container{max-width:430px;margin:0 auto;position:relative;z-index:1}
.title{font-family:var(--fh);font-size:24px;font-weight:700;text-align:center;margin-bottom:4px;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:13px;color:var(--t2);text-align:center;margin-bottom:16px}
/* tabs */
.tp{display:flex;gap:4px;background:var(--s);border:1px solid var(--b);border-radius:14px;padding:4px;margin-bottom:16px}
.tp-b{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;color:var(--t3);font-size:12px;font-weight:700;cursor:pointer;transition:all .25s;font-family:var(--f)}
.tp-b.a{background:rgba(249,115,22,.15);color:var(--c1);box-shadow:0 0 16px rgba(249,115,22,.1)}
.tp-b:active{transform:scale(.95)}
.sec{display:none}.sec.a{display:block;animation:fadeIn .25s ease}
/* cards */
.cd{background:var(--s);border:1px solid var(--b);border-radius:var(--br);padding:16px;margin-bottom:12px}
.cd-h{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;border:none;font-family:var(--f);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-p{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}.btn-p:hover{opacity:.9}
.btn-s{background:var(--s);border:1px solid var(--b);color:var(--t1)}.btn-s:hover{background:rgba(255,255,255,.08)}
.btn-r{background:var(--r);color:#fff}
.btn-sm{padding:6px 12px;font-size:11px}.btn:disabled{opacity:.4;cursor:default}
.inp{width:100%;padding:10px 12px;background:var(--s);border:1px solid var(--b);border-radius:8px;color:var(--t1);font-family:var(--f);font-size:14px;outline:none}
.inp:focus{border-color:var(--c1)}
.lbl{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;display:block}
.fl{display:flex}.fc{flex-direction:column}.f1{flex:1}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.ac{cursor:pointer}.tac{text-align:center}.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.w100{width:100%}.jc-sb{justify-content:space-between}.ai-c{align-items:center}.wrap{flex-wrap:wrap}
/* bottom nav */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.tb-in{pointer-events:auto;display:flex;width:100%;max-width:430px;gap:3px;padding:5px;background:rgba(10,10,13,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;backdrop-filter:blur(30px);box-shadow:0 8px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04)}
.tb-t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);text-decoration:none;transition:all .25s}
.tb-t-icon{font-size:16px;line-height:1}
.tb-t.a{color:var(--t1);background:rgba(255,255,255,.05);position:relative}
.tb-t.a::after{content:'';position:absolute;top:1px;left:25%;right:25%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--c1),var(--c2))}
/* gym specific */
.g-ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.g-ex:last-child{border-bottom:none}
.g-ex .nm{flex:1;font-size:14px;font-weight:500}
.g-ex .st{font-size:11px;color:var(--t3)}
.g-ex .ck{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s;font-size:11px}
.g-ex .ck.d{background:var(--g);border-color:var(--g);color:#fff}
.g-pill{display:inline-flex;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--s);border:1px solid var(--b);color:var(--t2);transition:all .2s;font-family:var(--f)}
.g-pill.a{background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.3);color:var(--c1)}
.g-pill:active{transform:scale(.95)}
.g-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.g-row:last-child{border-bottom:none}
.g-row .d{color:var(--t2);min-width:80px}.g-row .v{font-weight:600}
.g-row .tg{font-size:10px;padding:2px 8px;border-radius:10px;margin-left:auto;font-weight:600}
.g-row .tg.g{background:rgba(34,197,94,.15);color:var(--g)}
.g-row .tg.y{background:rgba(245,158,11,.15);color:var(--y)}
/* water specific */
.w-progress{height:32px;background:rgba(255,255,255,.04);border-radius:16px;overflow:hidden;position:relative;margin:12px 0}
.w-progress-fill{height:100%;border-radius:16px;transition:width .5s;background:linear-gradient(90deg,var(--c2),var(--c1))}
.w-progress-txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700}
.w-amt{font-size:32px;font-weight:700;text-align:center;margin:4px 0}
.w-target{font-size:12px;color:var(--t2);text-align:center}
/* sleep specific */
.s-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.s-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:600;background:rgba(255,255,255,.03);border:1px solid var(--b)}
.s-day .dn{color:var(--t3);margin-bottom:2px}
.s-day .hr{font-size:11px;color:var(--c1)}
.s-hist-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.s-hist-row:last-child{border-bottom:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
<div class="title">Fitness & Recovery</div>
<div class="sub">Track your gym, water, and sleep</div>

<div class="tp">
<button class="tp-b a" data-tab="gym" onclick="switchTab('gym')">Gym</button>
<button class="tp-b" data-tab="water" onclick="switchTab('water')">Water</button>
<button class="tp-b" data-tab="sleep" onclick="switchTab('sleep')">Sleep</button>
</div>

<!-- === GYM TAB === -->
<div id="sec-gym" class="sec a">
<div id="gymContent"></div>
</div>

<!-- === WATER TAB === -->
<div id="sec-water" class="sec">
<div id="waterContent"></div>
</div>

<!-- === SLEEP TAB === -->
<div id="sec-sleep" class="sec">
<div id="sleepContent"></div>
</div>

<nav class="tb"><div class="tb-in"><a class="tb-t" href="index.html"><span class="tb-t-icon">&#x1F3E0;</span>Home</a><a class="tb-t a" href="fitness.html"><span class="tb-t-icon">&#x1F4AA;</span>Fit</a><a class="tb-t" href="calendar.html"><span class="tb-t-icon">&#x1F4C5;</span>Cal</a><a class="tb-t" href="finance.html"><span class="tb-t-icon">&#x1F4B0;</span>Fin</a><a class="tb-t" href="focus.html"><span class="tb-t-icon">&#x1F3AF;</span>Focus</a><a class="tb-t" href="study.html"><span class="tb-t-icon">&#x1F4DA;</span>Study</a></div></nav>
</div>

<script>
// ======== CONFIG ========
var GYM_CONFIG = {
  appTitle: "Progressive Overload Coach", units: "lb",
  gyms: [{id:"home",name:"Home Gym"},{id:"comm",name:"Commercial Gym"}],
  days: [{id:"ua",name:"Upper Aesthetic"},{id:"full",name:"Full"},{id:"ub",name:"Upper Bodybuild"}],
  splitRotation: ["ua","full","rest","ub","rest","rest","rest"],
  splitAnchor: {date:"2026-05-18",splitId:"ua"},
  defaultExercises: [
    {name:"Bench press",gym:"comm",day:"ua",repMin:5,repMax:8,step:2.5,startWeight:60},
    {name:"Overhead press",gym:"comm",day:"ua",repMin:5,repMax:8,step:2.5,startWeight:35},
    {name:"Tricep pushdown",gym:"comm",day:"ua",repMin:8,repMax:12,step:2.5,startWeight:25},
    {name:"Pull-ups",gym:"both",day:"full",repMin:5,repMax:10,step:1,startWeight:0,bw:true},
    {name:"Barbell row",gym:"comm",day:"full",repMin:6,repMax:10,step:2.5,startWeight:50},
    {name:"Bicep curl",gym:"comm",day:"full",repMin:8,repMax:12,step:1.25,startWeight:15},
    {name:"Back squat",gym:"comm",day:"ub",repMin:5,repMax:8,step:5,startWeight:80},
    {name:"Romanian deadlift",gym:"comm",day:"ub",repMin:6,repMax:10,step:5,startWeight:60},
    {name:"Leg press",gym:"comm",day:"ub",repMin:8,repMax:12,step:5,startWeight:100}
  ]
};
var WATER_CONFIG = {unit:"bottle",bottleMl:500,glassMl:250,profile:{weightKg:75,age:25,sex:"m",activityHrsPerWeek:5},caffeineMgPerDay:200};

// ======== HELPERS ========
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dateKey(new Date())}

// ======== TABS ========
window.switchTab=function(tab){
  document.querySelectorAll('.tp-b').forEach(function(b){b.classList.toggle('a',b.dataset.tab===tab)})
  document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('a',s.id==='sec-'+tab)})
  if(tab==='gym')renderGym()
  if(tab==='water')renderWater()
  if(tab==='sleep')renderSleep()
}

// ======== GYM ========
var G_KEY='po_coach_v1'
function loadGym(){
  try{
    var raw=syncGet(G_KEY)
    if(raw)return normalizeGym(raw)
  }catch(e){}
  return normalizeGym({})
}
function saveGym(){syncSet(G_KEY,state)}
function normalizeGym(s){
  s=s||{}
  // Migrate old string arrays to objects
  if(Array.isArray(s.days)&&s.days.length&&typeof s.days[0]==='string'){
    var dm={};GYM_CONFIG.days.forEach(function(d){dm[d.id]=d.name})
    s.days=s.days.map(function(d){return{id:d,name:dm[d]||d.charAt(0).toUpperCase()+d.slice(1)}})
  }
  if(Array.isArray(s.gyms)&&s.gyms.length&&typeof s.gyms[0]==='string'){
    s.gyms=s.gyms.map(function(g){return{id:g,name:g.replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()})}})
  }
  s.gyms=Array.isArray(s.gyms)&&s.gyms.length?s.gyms:GYM_CONFIG.gyms.slice()
  s.days=Array.isArray(s.days)&&s.days.length?s.days:GYM_CONFIG.days.slice()
  s.units=s.units||GYM_CONFIG.units||'kg'
  s.exercises=Array.isArray(s.exercises)?s.exercises:GYM_CONFIG.defaultExercises.map(function(e,i){return Object.assign({id:'seed_'+i+'_'+Date.now()},e)})
  s.logs=s.logs&&typeof s.logs==='object'?s.logs:{}
  s.photos=Array.isArray(s.photos)?s.photos:[]
  s.filterGym=s.filterGym||s.gyms[0].id
  s.filterDay=s.filterDay||s.days[0].id
  // Migrate splitRotation from old string IDs
  if(Array.isArray(s.splitRotation)&&s.splitRotation.length&&typeof s.splitRotation[0]==='string'&&s.days.length&&!s.days.find(function(d){return d.name===s.splitRotation[0]})){
    var dn={};s.days.forEach(function(d){dn[d.id]=d.name})
    s.splitRotation=s.splitRotation.map(function(x){return dn[x]||x.charAt(0).toUpperCase()+x.slice(1)})
  }
  if(!Array.isArray(s.splitRotation)||!s.splitRotation.length){
    s.splitRotation=GYM_CONFIG.splitRotation.map(function(x){
      var d=GYM_CONFIG.days.find(function(d){return d.id===x})
      return d?d.name:(x==='rest'?'Rest':x.charAt(0).toUpperCase()+x.slice(1))
    })
  }
  if(!s.splitAnchor||!s.splitAnchor.date||s.splitAnchor.index==null){
    var aid=GYM_CONFIG.splitAnchor&&GYM_CONFIG.splitAnchor.splitId||'ua'
    var an=GYM_CONFIG.days.find(function(d){return d.id===aid})
    var tn=an?an.name:'UA'
    var idx=s.splitRotation.findIndex(function(n){return n.toLowerCase()===tn.toLowerCase()})
    s.splitAnchor={date:GYM_CONFIG.splitAnchor&&GYM_CONFIG.splitAnchor.date||'2026-05-18',index:idx>=0?idx:0}
  }
  return s
}
function isRest(n){return n==='Rest'||n==='Off'||n==='Recovery'}
function todayGymDay(){
  var rot=state.splitRotation, anc=state.splitAnchor
  if(!rot||!rot.length)return null
  var start=new Date(anc.date+'T00:00:00'), now=new Date()
  now.setHours(0,0,0,0)
  var diff=Math.round((now-start)/86400000)
  if(diff<0)return null
  return rot[(anc.index+diff)%rot.length]
}
function todayExercises(){
  var dayName=todayGymDay()
  if(!dayName||isRest(dayName))return[]
  var dayObj=state.days.find(function(d){return d.name===dayName})
  if(!dayObj)return[]
  return state.exercises.filter(function(e){
    var g=state.filterGym
    return e.day===dayObj.id&&(e.gym===g||e.gym==='both')
  })
}
function pastLogs(){
  var byDay={}
  state.exercises.forEach(function(ex){
    ;(state.logs[ex.id]||[]).forEach(function(l){
      var dk=l.date.slice(0,10)
      if(!byDay[dk])byDay[dk]=[]
      byDay[dk].push({ex:ex,log:l})
    })
  })
  return byDay
}
var state=loadGym()

function renderGym(){
  var c=$('gymContent')
  var dayName=todayGymDay()
  var isRestDay=dayName&&isRest(dayName)
  var html=''

  // Day info
  html+='<div class="cd" style="text-align:center;padding:12px">'
  html+='<div style="font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em">Today</div>'
  html+='<div style="font-size:16px;font-weight:700;margin-top:4px">'+esc(dayName||'Off')+'</div>'
  html+='</div>'

  if(!isRestDay&&dayName){
    // Gym/Date filters
    html+='<div class="cd">'
    html+='<div class="fl g8 wrap">'
    state.gyms.forEach(function(g){
      html+='<button class="g-pill'+(g.id===state.filterGym?' a':'')+'" onclick="setGym(\''+g.id+'\')">'+esc(g.name)+'</button>'
    })
    html+='</div></div>'

    // Exercises
    var exs=todayExercises()
    if(exs.length){
      // Today's logs
      var logs=pastLogs()
      var todayLogs=logs[todayKey()]||[]
      var loggedExIds={}
      todayLogs.forEach(function(l){loggedExIds[l.ex.id]=true})

      html+='<div class="cd"><div class="cd-h">Exercises</div>'
      exs.forEach(function(ex){
        var logged=!!loggedExIds[ex.id]
        var lastLog=state.logs[ex.id]&&state.logs[ex.id].length?state.logs[ex.id][state.logs[ex.id].length-1]:null
        html+='<div class="g-ex"><div class="nm">'+esc(ex.name)+
          (lastLog?'<div class="st">Last: '+lastLog.weight+state.units+' &times; '+lastLog.reps+'</div>':'<div class="st">Start: '+ex.startWeight+state.units+(ex.bw?' (BW)':'')+'</div>')+
          '</div>'
        if(logged){
          html+='<div class="ck d">&#x2713;</div>'
        }else{
          html+='<div class="ck" onclick="openLog(\''+ex.id+'\')">+</div>'
        }
        html+='</div>'
      })
      html+='</div>'

      // Quick log
      html+='<div class="cd hidden" id="logForm"><div class="cd-h">Log Set</div>'
      html+='<div id="logExName" style="font-size:14px;font-weight:600;margin-bottom:8px"></div>'
      html+='<div class="fl g8 ai-c">'
      html+='<div class="f1"><label class="lbl">Weight ('+state.units+')</label><input class="inp" type="number" id="logWeight" step="0.25"></div>'
      html+='<div style="width:80px"><label class="lbl">Reps</label><input class="inp" type="number" id="logReps"></div>'
      html+='<button class="btn btn-p" onclick="doLog()" style="margin-top:16px">Log</button>'
      html+='</div></div>'

      // Past sessions
      html+='<div class="cd"><div class="cd-h">History</div>'
      var pastEntries=Object.entries(pastLogs()).filter(function(e){return e[0]!==todayKey()}).sort(function(a,b){return b[0].localeCompare(a[0])}).slice(0,10)
      if(pastEntries.length){
        pastEntries.forEach(function(e){
          var dk=e[0], sets=e[1]
          var exNames=sets.map(function(s){return s.ex.name}).filter(function(v,i,a){return a.indexOf(v)===i}).slice(0,3).join(', ')
          var totalSets=sets.length, totalVol=sets.reduce(function(s,x){return s+(x.log.weight||0)*(x.log.reps||0)},0)
          html+='<div class="g-row"><span class="d">'+dk.slice(5)+'</span><span class="v">'+totalSets+' sets</span><span style="font-size:10px;color:var(--t3)">'+exNames+'</span></div>'
        })
      }else{
        html+='<div style="text-align:center;padding:10px;color:var(--t3);font-size:12px">No workouts logged yet.</div>'
      }
      html+='</div>'
    }else{
      html+='<div class="cd" style="text-align:center;padding:20px;color:var(--t3);font-size:13px">Rest day &mdash; no exercises scheduled.</div>'
    }
  }

  c.innerHTML=html
  state._logExId=null
}

function setGym(id){
  state.filterGym=id
  saveGym()
  renderGym()
}

var logId=null
function openLog(exId){
  var ex=state.exercises.find(function(e){return e.id===exId})
  if(!ex)return
  logId=exId
  var f=$('logForm')
  f.classList.remove('hidden')
  $('logExName').textContent=ex.name
  $('logWeight').value=ex.startWeight||0
  $('logReps').value=ex.repMin||5
}
function doLog(){
  if(!logId)return
  var w=parseFloat($('logWeight').value)
  var r=parseInt($('logReps').value,10)
  if(!w||!r){alert('Enter weight and reps');return}
  if(!state.logs[logId])state.logs[logId]=[]
  state.logs[logId].push({weight:w,reps:r,date:new Date().toISOString()})
  saveGym()
  $('logForm').classList.add('hidden')
  logId=null
  renderGym()
}

// ======== WATER ========
var W_KEY='po_water_v1'
function loadWater(){
  try{
    var raw=syncGet(W_KEY)
    if(raw)return raw
  }catch(e){}
  return {logs:{}}
}
function saveWater(){syncSet(W_KEY,wstate)}
var wstate=loadWater()

function renderWater(){
  var c=$('waterContent')
  var dk=todayKey()
  var count=wstate.logs[dk]||0
  var target=8
  var pct=Math.min(100,(count/target)*100)
  var html=''
  html+='<div class="cd" style="text-align:center"><div class="cd-h">Today</div>'
  html+='<div class="w-amt">'+count+' <span style="font-size:16px;color:var(--t2)">/ '+target+'</span></div>'
  html+='<div class="w-target">glasses</div>'
  html+='<div class="w-progress"><div class="w-progress-fill" style="width:'+pct+'%"></div><div class="w-progress-txt">'+Math.round(pct)+'%</div></div>'
  html+='<div class="fl g8" style="justify-content:center;margin-top:8px">'
  html+='<button class="btn btn-s" onclick="waterMinus()" '+(count<=0?'disabled':'')+'>&minus;</button>'
  html+='<button class="btn btn-p" onclick="waterPlus()" style="min-width:80px">+1 Glass</button>'
  html+='</div></div>'

  // History
  html+='<div class="cd"><div class="cd-h">This Week</div>'
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i)
    var k=dateKey(d), n=wstate.logs[k]||0
    var dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]
    var barPct=Math.min(100,(n/target)*100)
    html+='<div class="fl g8 ai-c" style="padding:6px 0;font-size:12px"><span style="width:30px;color:var(--t3)">'+dow+'</span><div style="flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+barPct+'%;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:3px"></div></div><span style="width:30px;text-align:right;font-weight:600">'+n+'</span></div>'
  }
  html+='</div>'

  c.innerHTML=html
}
function waterPlus(){var dk=todayKey();wstate.logs[dk]=(wstate.logs[dk]||0)+1;saveWater();renderWater()}
function waterMinus(){var dk=todayKey();if((wstate.logs[dk]||0)>0)wstate.logs[dk]--;saveWater();renderWater()}

// ======== SLEEP ========
var S_KEY='sleep_log'
function loadSleep(){
  try{
    var raw=syncGet(S_KEY)
    if(raw)return raw
  }catch(e){}
  return {}
}
function saveSleep(){syncSet(S_KEY,sstate)}
var sstate=loadSleep()

function renderSleep(){
  var c=$('sleepContent')
  var html=''
  html+='<div class="cd">'
  html+='<div class="cd-h">Log Sleep</div>'
  html+='<div class="fl g8"><div class="f1"><label class="lbl">Bed Time</label><input class="inp" type="time" id="sBed"></div><div class="f1"><label class="lbl">Wake Time</label><input class="inp" type="time" id="sWake"></div></div>'
  html+='<button class="btn btn-p mt8 w100" onclick="saveSleepEntry()">Save</button>'
  html+='</div>'

  // Weekly summary
  html+='<div class="cd"><div class="cd-h">This Week</div><div class="s-week">'
  var today=new Date()
  for(var i=6;i>=0;i--){
    var d=new Date(today);d.setDate(d.getDate()-i)
    var k=dateKey(d), entry=sstate[k]
    var dow=['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]
    html+='<div class="s-day"><div class="dn">'+dow+'</div>'
    if(entry){
      var bp=entry.bed.split(':'), wp=entry.wake.split(':')
      var h=wp[0]-bp[0], m=wp[1]-bp[1]
      if(h<0||(h===0&&m<0))h+=24
      var hrs=+(h+m/60).toFixed(1)
      html+='<div class="hr" style="color:'+(hrs>=8?'var(--g)':'var(--y)')+'">'+hrs+'h</div>'
    }else{
      html+='<div style="font-size:9px;color:var(--t3)">--</div>'
    }
    html+='</div>'
  }
  html+='</div></div>'

  // History
  html+='<div class="cd"><div class="cd-h">History</div>'
  var entries=Object.entries(sstate).sort(function(a,b){return b[0].localeCompare(a[0])}).slice(0,7)
  if(entries.length){
    entries.forEach(function(e){
      var dk=e[0], entry=e[1]
      var d=new Date(dk+'T12:00:00')
      var lbl=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
      var hrs=0
      if(entry.bed&&entry.wake){
        var bp=entry.bed.split(':'), wp=entry.wake.split(':')
        var h=wp[0]-bp[0], m=wp[1]-bp[1]
        if(h<0||(h===0&&m<0))h+=24;hrs=+(h+m/60).toFixed(1)
      }
      html+='<div class="g-row"><span class="d">'+lbl+'</span><span>'+entry.bed+' - '+entry.wake+'</span><span class="tg '+(hrs>=8?'g':'y')+'">'+hrs+'h</span></div>'
    })
  }else{
    html+='<div style="text-align:center;padding:10px;color:var(--t3);font-size:12px">No sleep data yet.</div>'
  }
  html+='</div>'

  c.innerHTML=html
}
function saveSleepEntry(){
  var b=$('sBed').value, w=$('sWake').value
  if(!b||!w){alert('Enter both bed and wake times');return}
  sstate[todayKey()]={bed:b,wake:w}
  saveSleep()
  renderSleep()
}

// ======== INIT ========
document.addEventListener('DOMContentLoaded',async function(){
  if(typeof syncInit==='function')await syncInit()
  // Reload state after sync
  state=loadGym();wstate=loadWater();sstate=loadSleep()
  // Show default (gym) tab
  renderGym()
})
</script>
