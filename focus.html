<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000000;--card-bg:#0a0a0f;--card-border:rgba(249,115,22,0.10);--mint:#F97316;--mint-dim:rgba(249,115,22,0.45);--amber:#fbbf24;--red:#f87171;--text:#ffffff;--o:#F97316;--o-dim:rgba(249,115,22,0.45)}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:auto}
body{max-width:480px;margin:0 auto;padding:60px 20px 100px;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px at 25% 15%,rgba(249,115,22,.06) 0%,transparent 70%);animation:amb 24s ease-in-out infinite alternate}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes amb{0%{transform:translate(0,0)scale(1)}25%{transform:translate(20px,-10px)scale(1.01)}50%{transform:translate(-15px,15px)scale(.99)}75%{transform:translate(10px,-20px)scale(1.02)}100%{transform:translate(-15px,8px)scale(.98)}}
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bIn{0%{width:0}}
.fade{animation:fadeUp 600ms ease-out backwards}
.home-divider{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.home-divider::before,.home-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.10)}
.home-divider span{font-size:11px;letter-spacing:0.22em;color:rgba(255,255,255,0.85);font-weight:500}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;padding:24px 22px 22px;margin-bottom:16px}
/* tab toggle */
.tt{display:flex;gap:4px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:14px;padding:4px;margin-bottom:18px}
.tt-b{flex:1;padding:12px;border-radius:11px;border:none;background:transparent;color:rgba(255,255,255,0.35);font-size:13px;font-weight:600;cursor:pointer;transition:all 300ms;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
.tt-b.a{background:var(--card-bg);border:1px solid var(--card-border);color:var(--mint)}
.tt-b:active{transform:scale(0.95)}
/* timer card */
.tc{background:var(--card-bg);border:1px solid var(--card-border);border-radius:28px;padding:28px 24px 24px;position:relative;overflow:hidden;margin-bottom:16px}
/* timer display */
.td{display:flex;flex-direction:column;align-items:center;padding:10px 0 20px}
.t-ring{position:relative;width:180px;height:180px;margin-bottom:6px}
.t-ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.t-ring-bg{fill:none;stroke:rgba(255,255,255,0.04);stroke-width:5}
.t-ring-fill{fill:none;stroke:url(#tGrad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 600ms cubic-bezier(0.22,1,0.36,1)}
.t-ring-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.t-time{font-size:52px;font-weight:700;font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-0.06em;line-height:1;font-variant-numeric:tabular-nums}
.t-phase{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.24em;margin-top:6px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.t-tab{font-size:10px;color:rgba(255,255,255,0.35);font-weight:500;margin-top:2px}
.t-status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 16px 6px 12px;border-radius:20px;font-size:11px;font-weight:600}
.t-status.running{background:rgba(0,245,255,0.08);border:1px solid rgba(0,245,255,0.15);color:#00F5FF}
.t-status.paused{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.15);color:var(--amber)}
.t-status.idle{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);color:rgba(255,255,255,0.35)}
.t-stat-dot{width:6px;height:6px;border-radius:50%}
.t-stat-dot.g{background:#00F5FF}.t-stat-dot.y{background:var(--amber)}
/* timer controls */
.t-ctrl{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.t-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 32px;border-radius:16px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all 200ms;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
.t-btn:active{transform:scale(0.92)}
.t-btn.start{background:var(--mint);color:#000}
.t-btn.stop{background:var(--red);color:#fff}
.t-btn.reset{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);color:rgba(255,255,255,0.55);padding:14px 20px}
/* settings */
.t-settings{padding-top:4px;border-top:1px solid rgba(255,255,255,0.05)}
.ts-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ts-row:last-child{margin-bottom:0}
.ts-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,0.35);min-width:52px}
.ts-val{font-size:14px;font-weight:600;font-family:ui-monospace,"SF Mono",Menlo,monospace;min-width:52px;text-align:right}
.ts-val.s{color:var(--amber)}
.ts-inp{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;outline:none;background:rgba(255,255,255,0.08)}
.ts-inp::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--text);background:var(--bg);cursor:pointer}
.ts-inp.f::-webkit-slider-thumb{border-color:var(--mint)}
.ts-inp.b::-webkit-slider-thumb{border-color:var(--amber)}
.t-cycle{width:100%;display:block;margin-top:14px;padding:14px;border-radius:14px;border:1px dashed rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.55);font-size:13px;font-weight:600;cursor:pointer;transition:all 250ms;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
.t-cycle:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.20);color:var(--text)}
.t-cycle:active{transform:scale(0.97)}
.t-cycle.a{border-style:solid;border-color:rgba(249,115,22,0.20);background:rgba(249,115,22,0.05);color:var(--mint)}
/* stats */
.st-h{font-size:16px;font-weight:600;letter-spacing:-0.02em;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.st-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0.08),transparent)}
.st-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.st-box{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:16px 8px;text-align:center}
.st-box-n{font-size:22px;font-weight:600;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--mint)}
.st-box-l{font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.10em;color:rgba(255,255,255,0.35);margin-top:4px}
/* session history */
.sh-list{list-style:none;margin-bottom:20px}
.sh-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;margin-bottom:4px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.04)}
.sh-item .sh-tag{width:4px;height:28px;border-radius:3px;flex-shrink:0}
.sh-item .sh-tag.focus{background:var(--mint)}
.sh-item .sh-tag.break{background:var(--amber)}
.sh-item .sh-info{flex:1}
.sh-item .sh-type{font-size:12px;font-weight:600}
.sh-item .sh-time{font-size:10px;color:rgba(255,255,255,0.35);font-family:ui-monospace,"SF Mono",Menlo,monospace}
.sh-item .sh-dur{font-size:13px;font-weight:600;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.sh-empty{font-size:12px;color:rgba(255,255,255,0.35);font-style:italic;text-align:center;padding:20px 0}
/* chart */
.ch{background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;padding:18px 16px;margin-bottom:20px}
.ch-h{font-size:13px;font-weight:600;letter-spacing:-0.01em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ch-h-s{font-size:10px;font-weight:500;color:rgba(255,255,255,0.35);font-family:ui-monospace,"SF Mono",Menlo,monospace;background:rgba(255,255,255,0.04);padding:2px 8px;border-radius:6px}
.ch-grid{display:flex;align-items:flex-end;gap:6px;height:100px;padding:0 4px}
.ch-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.ch-bar{width:100%;max-width:32px;border-radius:6px 6px 3px 3px;position:relative;min-height:4px;transition:height 800ms cubic-bezier(0.22,1,0.36,1);animation:bIn 800ms cubic-bezier(0.22,1,0.36,1) both}
.ch-bar.g1{background:var(--mint)}.ch-bar.g2{background:#00F5FF}.ch-bar.g3{background:#3B82F6}.ch-bar.g4{background:#C084FC}.ch-bar.g5{background:var(--amber)}
.ch-bar-l{font-size:8px;color:rgba(255,255,255,0.35);font-family:ui-monospace,"SF Mono",Menlo,monospace;margin-top:6px;font-weight:500;text-align:center}
.ch-bar-v{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:rgba(255,255,255,0.55);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:600;opacity:0;transition:opacity 300ms}
.ch-bar-wrap:hover .ch-bar-v{opacity:1}
.ch-breakdown{display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.ch-legend{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,0.55)}
.ch-legend-d{width:8px;height:8px;border-radius:3px}
/* tab bar */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 16px calc(8px+env(safe-area-inset-bottom));pointer-events:none}
.tb-in{pointer-events:auto;display:flex;width:100%;max-width:430px;gap:3px;padding:5px;background:rgba(10,10,13,0.92);border:1px solid rgba(255,255,255,0.08);border-radius:18px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 8px 40px rgba(0,0,0,0.65),inset 0 1px 0 rgba(255,255,255,0.04)}
.tb-t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.35);text-decoration:none;transition:all 250ms}
.tb-t.a{color:#fff;background:rgba(255,255,255,0.05);position:relative}
.tb-t.a::after{content:'';position:absolute;top:1px;left:25%;right:25%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--mint),rgba(249,115,22,0.40))}
.tb-t-icon{font-size:16px;line-height:1}
@media(min-width:768px){
body{max-width:1100px;padding:80px 40px 120px}
.tb-in{max-width:600px}
.tb-t{font-size:8px;padding:10px 6px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
</style>
<script src="js/sync.js"></script>
</head>
<body>

<div class="home-divider fade"><span>&#x1F3AF; FOCUS</span></div>

<div class="tt fade" style="animation-delay:40ms">
<button class="tt-b a" id="tabLearn">&#x1F4DA; Learning</button>
<button class="tt-b" id="tabBuild">&#x1F528; Building</button>
</div>

<div class="tc fade" style="animation-delay:80ms">
<div class="td">
<div class="t-ring">
<svg viewBox="0 0 120 120">
<defs>
<linearGradient id="tGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#00F5FF"/>
<stop offset="50%" stop-color="#7DD3FC"/>
<stop offset="100%" stop-color="#C084FC"/>
</linearGradient>
<linearGradient id="bGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#F2C063"/>
<stop offset="100%" stop-color="#E8927C"/>
</linearGradient>
</defs>
<circle class="t-ring-bg" cx="60" cy="60" r="52"/>
<circle class="t-ring-fill" id="tRing" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="0"/>
</svg>
<div class="t-ring-pct">
<div class="t-time" id="tTime">00:00</div>
<div class="t-phase" id="tPhase">FOCUS</div>
<div class="t-tab" id="tTab">Learning</div>
</div>
</div>
<div class="t-status idle" id="tStatus"><span class="t-stat-dot"></span>Ready</div>
</div>

<div class="t-ctrl">
<button class="t-btn start" id="tStart">&#x25B6; Start</button>
<button class="t-btn reset" id="tReset">&#x21BB;</button>
</div>

<div class="t-settings">
<div class="ts-row">
<span class="ts-label">Focus</span>
<input type="range" class="ts-inp f" id="fSlider" min="0" max="90" value="25">
<span class="ts-val" id="fVal">25 min</span>
</div>
<div class="ts-row">
<span class="ts-label">Break</span>
<input type="range" class="ts-inp b" id="bSlider" min="0" max="30" value="5">
<span class="ts-val s" id="bVal">5 min</span>
</div>
<button class="t-cycle" id="tCycle" disabled>&#x21BB; Continue cycle</button>
</div>
</div>

<div class="card fade" style="animation-delay:120ms">
<div class="st-h">Today's Focus</div>
<div class="st-grid">
<div class="st-box"><div class="st-box-n" id="stTotal">0</div><div class="st-box-l">Min Focused</div></div>
<div class="st-box"><div class="st-box-n" id="stSessions">0</div><div class="st-box-l">Sessions</div></div>
<div class="st-box"><div class="st-box-n" id="stBreaks">0</div><div class="st-box-l">Breaks</div></div>
</div>
<ul class="sh-list" id="shList">
<li class="sh-empty">No sessions logged yet today</li>
</ul>
</div>

<div class="card fade" style="animation-delay:160ms">
<div class="st-h">7-Day Overview <span class="ch-h-s" id="chAvg">—</span></div>
<div class="ch-grid" id="chGrid"></div>
<div class="ch-breakdown" id="chLegend"></div>
</div>

<nav class="tb"><div class="tb-in"><a class="tb-t" href="index.html"><span class="tb-t-icon">&#x1F3E0;</span>Home</a><a class="tb-t" href="planner.html"><span class="tb-t-icon">&#x1F9F0;</span>Plan</a><a class="tb-t" href="fitness.html"><span class="tb-t-icon">&#x1F4AA;</span>Fit</a><a class="tb-t" href="calendar.html"><span class="tb-t-icon">&#x1F4C5;</span>Cal</a><a class="tb-t" href="finance.html"><span class="tb-t-icon">&#x1F4B0;</span>Fin</a><a class="tb-t a" href="focus.html"><span class="tb-t-icon">&#x1F3AF;</span>Focus</a></div></nav>

<script>
// ==== Config ====
const CIRC=326.73;
const WAKE=7,SLEEP=23;
function gk(k){return window.syncGet?syncGet(k):(function(){try{return JSON.parse(localStorage.getItem(k))}catch{return null}})()}
function sk(k,v){if(window.syncSet)syncSet(k,v);else try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function td(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const AD=td();

// ==== Timer State ====
let state={
  tab:'learning',
  phase:'focus',
  running:false,
  paused:false,
  focusTotal:25*60,
  breakTotal:5*60,
  remaining:25*60,
  elapsed:0,
  timerStart:null,
  pauseRemaining:0,
  timerId:null,
  cycleStarted:false
};
// Restore timer state from localStorage
const savedState = gk('focus_state');
if(savedState){
  state.running = false;
  state.paused = false;
  if(savedState.running){
    const elapsed = (Date.now() - savedState.savedAt)/1000;
    state.remaining = Math.max(0, savedState.remaining - elapsed);
    state.focusTotal = savedState.focusTotal;
    state.breakTotal = savedState.breakTotal;
    state.phase = savedState.phase;
    state.tab = savedState.tab;
    state.cycleStarted = savedState.cycleStarted;
    state.pauseRemaining = state.remaining;
    state.timerStart = null;
    state.timerId = null;
  } else {
    Object.assign(state, savedState);
  }
  try{localStorage.removeItem('focus_state')}catch(e){}
}

function getLog(){return gk('focus_log')||{}}
function setLog(v){sk('focus_log',v)}

// ==== UI Refs ====
const $=(id)=>document.getElementById(id);
const tTime=$('tTime'),tPhase=$('tPhase'),tTab=$('tTab'),tRing=$('tRing'),tStatus=$('tStatus'),tStart=$('tStart'),tCycle=$('tCycle');
const fSlider=$('fSlider'),bSlider=$('bSlider'),fVal=$('fVal'),bVal=$('bVal');

// ==== Tab Toggle ====
$('tabLearn').addEventListener('click',()=>{if(state.running)return;$('tabLearn').classList.add('a');$('tabBuild').classList.remove('a');state.tab='learning';tTab.textContent='Learning';renderChart()});
$('tabBuild').addEventListener('click',()=>{if(state.running)return;$('tabBuild').classList.add('a');$('tabLearn').classList.remove('a');state.tab='building';tTab.textContent='Building';renderChart()});

// ==== Sliders ====
fSlider.addEventListener('input',()=>{const v=Number(fSlider.value);fVal.textContent=v+' min';if(!state.running){state.focusTotal=v*60;state.remaining=state.focusTotal;updateDisplay();updateRing()}});
bSlider.addEventListener('input',()=>{const v=Number(bSlider.value);bVal.textContent=v+' min';if(!state.running)state.breakTotal=v*60});

// ==== Timer Display ====
function fmt(s){const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function updateDisplay(){tTime.textContent=fmt(Math.max(0,Math.round(state.remaining)))}
function updateRing(){const pct=state.phase==='focus'?(state.remaining/state.focusTotal):state.breakTotal>0?(state.remaining/state.breakTotal):1;const off=CIRC-(Math.max(0,pct)*CIRC);tRing.style.strokeDashoffset=off;const grad=state.phase==='focus'?'url(#tGrad)':'url(#bGrad)';tRing.setAttribute('stroke',grad)}
function setStatus(type,text){tStatus.className='t-status '+type;tStatus.innerHTML='<span class="t-stat-dot '+(type==='running'?'g':type==='paused'?'y':'')+'"></span>'+text}
function setPhase(p){state.phase=p;tPhase.textContent=p==='focus'?'FOCUS':'BREAK';tPhase.style.color=p==='focus'?'#F97316':'#fbbf24';tTab.textContent=state.tab==='learning'?'Learning':'Building';updateRing()}

// ==== Timer Control ====
function tick(){
  if(!state.running||state.paused)return;
  const now=Date.now();
  const elapsed=(now-state.timerStart)/1000;
  state.remaining=Math.max(0,state.pauseRemaining-elapsed);
  updateDisplay();updateRing();sk('focus_state',{...state,savedAt:Date.now()});
  if(state.remaining<=0){
    state.remaining=0;updateDisplay();updateRing();
    phaseComplete()
  }
}

function phaseComplete(){
  stopTimer();
  beep();
  if(state.phase==='focus'){
    addSession('focus',state.tab,state.focusTotal);
    state.focusTotal=Number(fSlider.value)*60;
    if(state.breakTotal>0){
      state.phase='break';state.remaining=state.breakTotal;
      updateDisplay();updateRing();setPhase('break');
      setStatus('idle','Break ready');
      state.cycleStarted=true;tCycle.disabled=false;tCycle.classList.add('a');
      tCycle.textContent='\u{1F504} Start break';
      tStart.textContent='\u25B6 Start';tStart.className='t-btn start'
    }else{
      setStatus('idle','Session complete');
      tCycle.disabled=false;tCycle.textContent='\u21BB Continue cycle'
    }
  }else{
    addSession('break','-',state.breakTotal);
    state.breakTotal=Number(bSlider.value)*60;
    state.phase='focus';state.remaining=state.focusTotal;
    updateDisplay();updateRing();setPhase('focus');
    setStatus('idle','Focus ready');
    tCycle.textContent='\u21BB Continue cycle';tCycle.classList.add('a');
    tStart.textContent='\u25B6 Start';tStart.className='t-btn start'
  }
  renderStats();renderHistory()
}

function startTimer(){
  if(state.remaining<=0){
    if(state.phase==='focus'&&state.focusTotal<=0){alert('Set focus time > 0');return}
    if(state.phase==='break'&&state.breakTotal<=0){phaseComplete();return}
    if(state.phase==='focus'&&state.focusTotal<=0)return
  }
  state.running=true;state.paused=false;
  state.timerStart=Date.now();
  state.pauseRemaining=state.remaining;
  state.timerId=setInterval(tick,200);
  tStart.textContent='\u23F8 Pause';tStart.className='t-btn stop';
  setStatus('running','Focusing');
  if(state.phase==='break')setStatus('running','On break');
  state.cycleStarted=true;tCycle.disabled=true;tCycle.classList.remove('a')
}

function pauseTimer(){
  state.paused=true;
  if(state.timerId){clearInterval(state.timerId);state.timerId=null}
  state.pauseRemaining=state.remaining;
  tStart.textContent='\u25B6 Resume';tStart.className='t-btn start';
  setStatus('paused','Paused');
  tCycle.disabled=false;tCycle.classList.add('a');
  tCycle.textContent=state.phase==='focus'?'\u21BB End focus & continue':'\u21BB End break & continue'
}

function stopTimer(){
  state.running=false;state.paused=false;
  if(state.timerId){clearInterval(state.timerId);state.timerId=null}
  tStart.textContent='\u25B6 Start';tStart.className='t-btn start';
  try{localStorage.removeItem('focus_state')}catch(e){}
}

tStart.addEventListener('click',()=>{
  if(state.running&&!state.paused){pauseTimer();return}
  if(state.paused){resumeTimer();return}
  if(state.phase==='focus'&&state.focusTotal<=0){alert('Set focus time');return}
  startTimer()
});

function resumeTimer(){
  state.paused=false;state.running=true;
  state.timerStart=Date.now();
  state.pauseRemaining=state.remaining;
  state.timerId=setInterval(tick,200);
  tStart.textContent='\u23F8 Pause';tStart.className='t-btn stop';
  setStatus('running','Focusing');
  if(state.phase==='break')setStatus('running','On break');
  tCycle.disabled=true;tCycle.classList.remove('a')
}

$('tReset').addEventListener('click',()=>{
  stopTimer();
  state.phase='focus';state.focusTotal=Number(fSlider.value)*60;
  state.breakTotal=Number(bSlider.value)*60;
  state.remaining=state.focusTotal;state.pauseRemaining=0;
  state.cycleStarted=false;tCycle.disabled=true;tCycle.classList.remove('a');
  tCycle.textContent='\u21BB Continue cycle';
  updateDisplay();updateRing();setPhase('focus');
  setStatus('idle','Ready');
  try{localStorage.removeItem('focus_state')}catch(e){}
});

tCycle.addEventListener('click',()=>{
  if(state.running&&!state.paused){
    pauseTimer();return
  }
  if(state.remaining>0&&!state.paused){
    if(state.phase==='focus'){
      addSession('focus',state.tab,state.focusTotal-Math.round(state.remaining));
      state.focusTotal=Number(fSlider.value)*60
    }else{
      addSession('break','-',state.breakTotal-Math.round(state.remaining));
      state.breakTotal=Number(bSlider.value)*60
    }
  }
  stopTimer();
  if(state.phase==='focus'){
    state.phase='break';state.remaining=state.breakTotal;
    if(state.breakTotal<=0){state.phase='focus';state.remaining=state.focusTotal;tCycle.textContent='\u21BB Continue cycle';tCycle.disabled=true;tCycle.classList.remove('a');updateDisplay();updateRing();setPhase('focus');setStatus('idle','Ready');renderStats();renderHistory();return}
  }else{
    state.phase='focus';state.remaining=state.focusTotal
  }
  updateDisplay();updateRing();setPhase(state.phase);
  setStatus('idle',state.phase==='focus'?'Focus ready':'Break ready');
  tStart.textContent='\u25B6 Start';tStart.className='t-btn start';
  tCycle.textContent='\u21BB Continue cycle';tCycle.disabled=false;tCycle.classList.add('a');
  state.cycleStarted=true;renderStats();renderHistory()
});

// ==== Logging ====
function addSession(type,tab,dur){
  if(dur<30)return;
  const log=getLog(),d=td(),day=log[d]||{sessions:[]};
  const secs=Math.round(dur);
  day.sessions.push({
    type,tab,
    dur:secs,
    time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})
  });
  log[d]=day;setLog(log);renderStats();renderHistory()
}

function getTodayStats(){
  const log=getLog(),d=td(),day=log[d];
  if(!day||!day.sessions||!day.sessions.length)return{total:0,sessions:0,breaks:0,list:[]};
  const list=day.sessions;
  let total=0,breaks=0;
  list.forEach(s=>{if(s.type==='focus')total+=s.dur;if(s.type==='break')breaks++});
  return{total:Math.round(total/60),sessions:list.filter(s=>s.type==='focus').length,breaks,list}
}

function renderStats(){
  const s=getTodayStats();
  $('stTotal').textContent=s.total;
  $('stSessions').textContent=s.sessions;
  $('stBreaks').textContent=s.breaks
}

function renderHistory(){
  const s=getTodayStats();
  const el=$('shList');el.innerHTML='';
  if(!s.list.length){el.innerHTML='<li class="sh-empty">No sessions logged yet today</li>';return}
  s.list.slice().reverse().forEach((se,i)=>{
    const li=document.createElement('li');li.className='sh-item';li.style.animationDelay=(i*0.04)+'s';
    li.innerHTML='<div class="sh-tag '+(se.type==='focus'?'focus':'break')+'"></div><div class="sh-info"><div class="sh-type">'+(se.type==='focus'?se.tab==='learning'?'Learning':'Building':'Break')+'</div><div class="sh-time">'+se.time+'</div></div><div class="sh-dur">'+(se.type==='focus'?Math.round(se.dur/60)+'m':Math.round(se.dur/60)+'m')+'</div>';
    el.appendChild(li)
  })
}

// ==== Chart ====
const COLORS=['g1','g2','g3','g4','g5'];
function renderChart(){
  const log=getLog();
  const days=[];const today=new Date();
  for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);days.push(d)}
  const el=$('chGrid');el.innerHTML='';
  let maxVal=0;const values=days.map(d=>{
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const day=log[key];
    if(!day||!day.sessions)return 0;
    let t=0;day.sessions.forEach(s=>{if(s.type==='focus')t+=s.dur});
    const mins=Math.round(t/60);
    if(mins>maxVal)maxVal=mins;
    return mins
  });
  if(maxVal===0)maxVal=1;
  const avg=Math.round(values.reduce((a,b)=>a+b,0)/values.length);
  $('chAvg').textContent='Avg '+avg+'m';
  const leg=$('chLegend');leg.innerHTML='';
  leg.innerHTML='<div class="ch-legend"><div class="ch-legend-d" style="background:var(--mint)"></div>Focus</div><div class="ch-legend"><div class="ch-legend-d" style="background:var(--amber)"></div>Break</div>';
  if($('tabLearn').classList.contains('a'))leg.innerHTML+='<div class="ch-legend" style="color:rgba(255,255,255,0.35)">\u{1F4DA} Learning</div>';
  else leg.innerHTML+='<div class="ch-legend" style="color:rgba(255,255,255,0.35)">\u{1F528} Building</div>';
  days.forEach((d,i)=>{
    const wrap=document.createElement('div');wrap.className='ch-bar-wrap';
    const bar=document.createElement('div');bar.className='ch-bar '+COLORS[i%COLORS.length];
    const h=Math.max(4,(values[i]/maxVal)*80);
    bar.style.height=h+'px';
    const v=document.createElement('div');v.className='ch-bar-v';v.textContent=values[i]+'m';
    const lbl=document.createElement('div');lbl.className='ch-bar-l';
    lbl.textContent=d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,2);
    bar.appendChild(v);wrap.appendChild(bar);wrap.appendChild(lbl);el.appendChild(wrap)
  })
}

// ==== Sound ====
function beep(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator();const g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.value=880;o.type='sine';g.gain.value=0.15;
    o.start();g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.3);
    o.stop(ac.currentTime+0.3);
    if('Notification'in window&&Notification.permission==='granted'){
      const t=state.phase==='focus'?'Break time!':'Focus time!';
      new Notification('Focus Timer',{body:t})
    }
  }catch(e){}
}
if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();

// ==== Init ====
if(window.syncInit)syncInit();
setInterval(function(){if(window.syncPullAll)syncPullAll().then(function(){renderStats();renderHistory();renderChart()})},30000);
renderStats();renderHistory();renderChart();
setPhase(state.phase);updateDisplay();updateRing();
if(state.remaining!==25*60&&state.remaining>0){setStatus('paused','Paused');tStart.textContent='▶ Resume';tStart.className='t-btn start'}
</script>
