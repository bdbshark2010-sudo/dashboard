<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Dashboard</title>
<style>
:root{--bg:#09090B;--s:rgba(255,255,255,.04);--s2:rgba(255,255,255,.07);--b:rgba(255,255,255,.07);--t1:#F5F4F0;--t2:#B0ADA7;--t3:#6E6B66;--g:#5CDB95;--y:#F2C063;--r:#FF6B6B;--bl:#7DD3FC;--f:-apple-system,BlinkMacSystemFont,"SF Pro","Inter",sans-serif;--m:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--f);display:flex;justify-content:center;padding:20px 16px 100px;min-height:100vh;overflow-x:hidden}
.container{width:100%;max-width:430px}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(180deg,#FFF 50%,#C7C4BC);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px}
.card{background:var(--s);border-radius:18px;padding:18px 20px;border:1px solid var(--b);backdrop-filter:blur(40px);margin-bottom:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.sec{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-l{font-size:12px;font-weight:700;letter-spacing:-.01em;color:var(--t2)}
.sec-r{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);font-family:var(--m)}

/* quick stats */
.qs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.qs-i{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:14px 6px;text-align:center}
.qs-d{width:10px;height:10px;border-radius:50%;margin:0 auto 7px}
.qs-d.g{background:var(--g);box-shadow:0 0 10px rgba(92,219,149,.25)}
.qs-d.y{background:var(--y);box-shadow:0 0 10px rgba(242,192,99,.25)}
.qs-d.bl{background:var(--bl);box-shadow:0 0 10px rgba(125,211,252,.25)}
.qs-d.o{background:#E8927C;box-shadow:0 0 10px rgba(232,146,124,.25)}
.qs-l{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);margin-bottom:4px}
.qs-v{font-size:18px;font-weight:800;font-family:var(--m);font-variant-numeric:tabular-nums}
.qs-v.s{font-size:11px;font-weight:700}

/* day bar */
.db{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.db-ring{position:relative;width:70px;height:70px;flex-shrink:0}
.db-ring svg{transform:rotate(-90deg)}
.db-ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;font-family:var(--m)}
.db-m{flex:1}
.db-p{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--t3)}
.db-l{font-size:17px;font-weight:700;margin:1px 0}
.db-l.rest{color:var(--bl)}
.db-l.gym{color:var(--g)}
.db-c{font-size:11px;color:var(--t2);font-family:var(--m);font-variant-numeric:tabular-nums}
.alarm-bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;border-radius:10px;background:rgba(255,107,107,.10);border:1px solid rgba(255,107,107,.2)}
.alarm-text{flex:1;font-size:11px;color:var(--r);font-weight:600}
.alarm-dismiss{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--t1);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:10px}

/* water + sleep bar */
.wsb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ws{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:14px 16px}
.ws-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ws-l{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--t3)}
.ws-v{font-size:22px;font-weight:800;font-family:var(--m);font-variant-numeric:tabular-nums}
.ws-sub{font-size:9px;color:var(--t2);margin-bottom:6px}
.ws-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.ws-bar-f{height:100%;border-radius:2px;transition:width .6s}
.ws-bar-f.g{background:var(--g)}
.ws-bar-f.y{background:var(--y)}
.ws-bar-f.r{background:var(--r)}

/* sync bar */
.sb{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--s);border:1px solid var(--b);font-size:10px;font-family:var(--m);margin-bottom:12px}
.sb-d{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-d.g{background:var(--g)}
.sb-d.r{background:var(--r)}
.sb-d.y{background:var(--y)}
.sb-t{flex:1;color:var(--t3)}
.sb-btn{background:rgba(255,255,255,.06);border:1px solid var(--b);color:var(--t2);padding:4px 10px;border-radius:7px;cursor:pointer;font-size:9px;cursor:pointer}

/* goals */
.gl{list-style:none}
.gl-i{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}
.gl-i:last-child{border-bottom:none}
.gl-cb{width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);cursor:pointer;flex-shrink:0;appearance:none;display:flex;align-items:center;justify-content:center;transition:all .2s}
.gl-cb:checked{background:var(--g);border-color:var(--g);box-shadow:0 0 8px rgba(92,219,149,.3)}
.gl-cb:checked::after{content:'\2713';color:var(--bg);font-size:12px;font-weight:700}
.gl-t{flex:1;font-size:13px}
.gl-i.d .gl-t{text-decoration:line-through;color:var(--t3)}
.gl-q{background:none;border:none;color:var(--t3);cursor:pointer;font-size:11px;padding:3px;opacity:.4;transition:opacity .15s}
.gl-q.a{opacity:1;color:var(--y);filter:drop-shadow(0 0 3px rgba(242,192,99,.4))}
.gl-d{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:3px;opacity:0;transition:opacity .15s}
.gl-i:hover .gl-d{opacity:.5}
.gl-d:hover{color:var(--r)}
.em{font-size:12px;color:var(--t3);font-style:italic;padding:12px 0;text-align:center}
.gir{display:flex;gap:8px;border-top:1px solid var(--b);padding-top:12px;margin-top:2px}
.gi{flex:1;padding:10px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--b);color:var(--t1);font-size:13px;outline:none}
.gi:focus{border-color:rgba(255,255,255,.2)}
.gi::placeholder{color:var(--t3)}
.gb{background:linear-gradient(180deg,#FFF 0%,#E8E5DD 100%);color:#0A0A0B;font-weight:700;font-size:11px;padding:10px 18px;border:none;border-radius:11px;cursor:pointer;transition:transform .15s}
.gb:hover{transform:translateY(-1px)}
.gpb{width:100%;display:block;background:none;border:1px dashed var(--b);color:var(--t3);cursor:pointer;padding:9px;border-radius:10px;font-size:11px;margin-top:8px}
.gpb:hover{color:var(--t1)}
.gst{font-size:10px;color:var(--t3);margin-top:6px;min-height:14px}

/* tomorrow */
.tom .gl-q,.tom .gl-d{display:none}
.tl{font-size:10px;color:var(--t3);margin-bottom:8px}
.gtc{font-size:9px;font-family:var(--m);text-transform:uppercase;font-variant-numeric:tabular-nums;color:var(--t3)}

/* tab bar */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.tb-in{pointer-events:auto;display:flex;width:100%;max-width:430px;gap:3px;padding:5px;background:rgba(14,14,16,.88);border:1px solid var(--b);border-radius:16px;backdrop-filter:blur(30px);box-shadow:0 8px 32px rgba(0,0,0,.55)}
.tb-t{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 3px;border-radius:11px;font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);text-decoration:none;transition:all .15s}
.tb-t.a{color:var(--t1);background:rgba(255,255,255,.05)}
.tb-t:hover{color:var(--t2)}
.tb-t-icon{font-size:17px;line-height:1}
body{padding-bottom:90px}
</style>
</head>
<body>
<div class="container">
<h1>Dashboard</h1>

<!-- Quick stats -->
<div class="qs">
<div class="qs-i"><div class="qs-d g"></div><div class="qs-l">Goals</div><div class="qs-v" id="qsGoals">0</div></div>
<div class="qs-i"><div class="qs-d bl"></div><div class="qs-l">Water</div><div class="qs-v" id="qsWater">0</div></div>
<div class="qs-i"><div class="qs-d y"></div><div class="qs-l">Sleep</div><div class="qs-v s" id="qsSleep">—</div></div>
<div class="qs-i"><div class="qs-d o"></div><div class="qs-l">Gym</div><div class="qs-v s" id="qsGym">—</div></div>
</div>

<!-- Day bar -->
<div class="db">
<div class="db-ring">
<svg width="70" height="70" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="4"/><circle id="dbFill" cx="30" cy="30" r="25" fill="none" stroke="#5CDB95" stroke-width="4" stroke-linecap="round" stroke-dasharray="157.08" stroke-dashoffset="157.08" style="transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1),stroke .8s"/></svg>
<div class="db-ring-pct" id="dbPct">0%</div>
</div>
<div class="db-m">
<div class="db-p" id="dbPhase">WAKE UP</div>
<div class="db-l" id="dbLabel">—</div>
<div class="db-c" id="dbClock">—</div>
<div class="alarm-bar" id="alarmBar" style="display:none"><span class="alarm-text" id="alarmText">Bedtime in 30 min</span><button class="alarm-dismiss" id="alarmDismiss">Dismiss</button></div>
</div>
</div>

<!-- Water + Sleep -->
<div class="wsb">
<div class="ws">
<div class="ws-top"><span class="ws-l">Water</span><span class="ws-sub" id="wsWaterSub">0</span></div>
<div class="ws-v" id="wsWaterVal">0</div>
<div class="ws-bar"><div class="ws-bar-f g" id="wsWaterBar" style="width:0%"></div></div>
</div>
<div class="ws">
<div class="ws-top"><span class="ws-l">Sleep</span><span class="ws-sub" id="wsSleepSub">—</span></div>
<div class="ws-v" id="wsSleepVal">—</div>
<div class="ws-bar"><div class="ws-bar-f" id="wsSleepBar" style="width:0%"></div></div>
</div>
</div>

<!-- Sync -->
<div class="sb"><div class="sb-d y" id="sbDot"></div><span class="sb-t" id="sbText">Sync ready</span><button class="sb-btn" id="sbBtn">Sync</button></div>

<!-- Goals -->
<div class="card" id="tc">
<div class="sec"><span class="sec-l">Today</span><span class="sec-r" id="goalCount">0/0</span></div>
<ul class="gl" id="gl"></ul>
<div class="em" id="em">No goals — add one below</div>
<button class="gpb" id="gpb" style="display:none">Push remaining → tomorrow</button>
<div class="gir"><input class="gi" id="ti" placeholder="Add a goal..." autocomplete="off"><button class="gb" id="tab">+</button></div>
<div class="gst" id="ts"></div>
</div>

<!-- Tomorrow -->
<div class="card tom" id="tomc">
<div class="sec"><span class="sec-l">Tomorrow</span><span class="gtc" id="gtc">0 planned</span></div>
<ul class="gl" id="tomgl"></ul>
<div class="em" id="tome">Nothing planned</div>
<div class="gir"><input class="gi" id="tomi" placeholder="Plan for tomorrow..." autocomplete="off"><button class="gb" id="tomab">+</button></div>
</div>

</div>

<nav class="tb"><div class="tb-in"><a class="tb-t a" href="index.html"><span class="tb-t-icon">&#x1F3E0;</span>Home</a><a class="tb-t" href="gym.html"><span class="tb-t-icon">&#x1F3CB;</span>Gym</a><a class="tb-t" href="water.html"><span class="tb-t-icon">&#x1F4A7;</span>Water</a><a class="tb-t" href="sleep.html"><span class="tb-t-icon">&#x1F634;</span>Sleep</a><a class="tb-t" href="calendar.html"><span class="tb-t-icon">&#x1F4C5;</span>Cal</a><a class="tb-t" href="finance.html"><span class="tb-t-icon">&#x1F4B0;</span>Finance</a></div></nav>

<script>
const WAKE=7,SLEEP=23;
function gk(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
let _sbt;
function sk(k,v){localStorage.setItem(k,JSON.stringify(v));window.dispatchEvent(new CustomEvent('gc'));clearTimeout(_sbt);_sbt=setTimeout(sbPush,2000)}
function dk(k){localStorage.removeItem(k)}
function lk(p){const r=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(p))r.push(k)}return r}
function td(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ad(){const d=new Date();if(d.getHours()<6)d.setDate(d.getDate()-1);return td()}
function tomd(){const d=new Date();if(d.getHours()<6)return td();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fd(ds){const p=ds.split('-');return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
const AD=ad(),TD=tomd();
function lg(d){return gk('goals:'+d)||[]}
function sg(d,v){sk('goals:'+d,v)}

function renderMinis(){
  const qsG=document.getElementById('qsGoals'),qsW=document.getElementById('qsWater'),qsS=document.getElementById('qsSleep'),qsGy=document.getElementById('qsGym');
  // Goals
  const gs=lg(AD);const dn=gs.filter(g=>g.done).length;
  qsG.textContent=dn+'/'+gs.length;
  document.getElementById('goalCount').textContent=dn+'/'+gs.length;
  // Water
  const wa=gk('po_water_v1');const wk=td();const wc=(wa&&wa.logs&&wa.logs[wk])||0;
  qsW.textContent=wc;
  document.getElementById('wsWaterVal').textContent=wc;
  const wu=(wa&&wa.unit)||'bottle';
  document.getElementById('wsWaterSub').textContent=wc+' '+wu+(wc===1?'':'s');
  document.getElementById('wsWaterBar').style.width=Math.min(100,wc*11)+'%';
  // Sleep
  const sl=gk('sleep_log')||{};const sy=td();const sn=sl[sy];
  if(sn){
    const bp=sn.bed.split(':').map(Number),wp=sn.wake.split(':').map(Number);let h=wp[0]-bp[0],m=wp[1]-bp[1];if(h<0||(h===0&&m<0))h+=24;
    const hrs=+(h+m/60).toFixed(1);
    qsS.textContent=hrs+'h';
    document.getElementById('wsSleepVal').textContent=hrs+'h';
    document.getElementById('wsSleepSub').textContent=sn.bed+' → '+sn.wake;
    const p=Math.min(100,hrs/8*100);
    document.getElementById('wsSleepBar').style.width=p+'%';
    document.getElementById('wsSleepBar').className='ws-bar-f '+(hrs>=8?'g':hrs>=5?'y':'r')
  }else{qsS.textContent='—';document.getElementById('wsSleepVal').textContent='—';document.getElementById('wsSleepSub').textContent='—'}
  // Gym
  const gy=gk('po_coach_v1');
  if(gy&&gy.splitRotation&&gy.splitAnchor){
    const rot=gy.splitRotation,a=new Date(gy.splitAnchor.date);a.setHours(0,0,0,0);
    const t=new Date();t.setHours(0,0,0,0);
    const diff=Math.round((t-a)/86400000);
    const idx=((gy.splitAnchor.index+diff)%rot.length+rot.length)%rot.length;
    const nm=rot[idx],ir=/^rest\b/i.test(nm||'');
    qsGy.textContent=ir?'REST':nm.toUpperCase();
    qsGy.style.color=ir?'var(--bl)':'var(--g)'
  }else qsGy.textContent='—'
}

function renderDayRing(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes();
  const total=16*60,elapsed=Math.max(0,Math.min(total,(h-WAKE)*60+m));
  const pct=Math.round(elapsed/total*100);
  const circ=157.08,off=circ-(pct/100*circ);
  document.getElementById('dbFill').style.strokeDashoffset=off;
  document.getElementById('dbPct').textContent=pct+'%';
  document.getElementById('dbClock').textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
  const el=document.getElementById('dbLabel');
  const ep=document.getElementById('dbPhase');
  if(h<WAKE){ep.textContent='NIGHT';el.textContent='Before dawn';el.className='db-l rest';document.getElementById('dbFill').style.stroke='var(--bl)'}
  else if(h<12){ep.textContent='MORNING';el.textContent='Start the day';el.className='db-l gym';document.getElementById('dbFill').style.stroke='var(--g)'}
  else if(h<17){ep.textContent='AFTERNOON';el.textContent='Keep going';el.className='db-l';document.getElementById('dbFill').style.stroke='var(--y)'}
  else if(h<SLEEP){ep.textContent='EVENING';el.textContent='Wind down';el.className='db-l rest';document.getElementById('dbFill').style.stroke='var(--bl)'}
  else{ep.textContent='SLEEP';el.textContent='Time to rest';el.className='db-l';document.getElementById('dbFill').style.stroke='var(--r)'}
}

function renderGoals(){
  const gs=lg(AD);
  const gl=document.getElementById('gl');gl.innerHTML='';
  document.getElementById('em').style.display=gs.length?'none':'block';
  gs.forEach((g,i)=>{
    const li=document.createElement('li');li.className='gl-i'+(g.done?' d':'');
    const st=g.important?'&#9733;':'&#9734;';
    li.innerHTML='<input type="checkbox" class="gl-cb"'+(g.done?' checked':'')+'><span class="gl-t">'+g.text+'</span><button class="gl-q'+(g.important?' a':'')+'" data-i="'+i+'">'+st+'</button><button class="gl-d" data-i="'+i+'">&#215;</button>';
    li.querySelector('.gl-cb').addEventListener('change',function(){
      const a=lg(AD);a[i].done=this.checked;sg(AD,a);renderGoals()
    });
    li.querySelector('.gl-d').addEventListener('click',function(){
      if(!confirm('Delete?'))return;const a=lg(AD);a.splice(i,1);sg(AD,a);renderGoals()
    });
    li.querySelector('.gl-q').addEventListener('click',function(){
      const a=lg(AD);a[i].important=!a[i].important;sg(AD,a);renderGoals()
    });
    gl.appendChild(li)
  });
  const dn=gs.filter(g=>g.done).length;
  document.getElementById('goalCount').textContent=dn+'/'+gs.length;
  document.getElementById('qsGoals').textContent=dn+'/'+gs.length;
  document.getElementById('gpb').style.display=gs.length&&gs.some(g=>!g.done)?'block':'none'
}

function renderTomorrow(){
  const gs=lg(TD);
  const gl=document.getElementById('tomgl');gl.innerHTML='';
  document.getElementById('tome').style.display=gs.length?'none':'block';
  document.getElementById('gtc').textContent=gs.length+' planned';
  gs.forEach((g,i)=>{
    const li=document.createElement('li');li.className='gl-i';
    li.innerHTML='<span class="gl-t" style="opacity:.7">'+g.text+'</span><button class="gl-d" data-i="'+i+'">&#215;</button>';
    li.querySelector('.gl-d').addEventListener('click',function(){
      if(!confirm('Delete?'))return;const a=lg(TD);a.splice(i,1);sg(TD,a);renderTomorrow()
    });
    gl.appendChild(li)
  })
}

document.getElementById('tab').addEventListener('click',()=>{
  const inp=document.getElementById('ti'),v=inp.value.trim();
  if(!v)return;const a=lg(AD);a.push({text:v,done:false,important:false});sg(AD,a);inp.value='';renderGoals();renderMinis()
});
document.getElementById('ti').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('tab').click()});
document.getElementById('tomab').addEventListener('click',()=>{
  const inp=document.getElementById('tomi'),v=inp.value.trim();
  if(!v)return;const a=lg(TD);a.push({text:v,done:false});sg(TD,a);inp.value='';renderTomorrow()
});
document.getElementById('tomi').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('tomab').click()});
document.getElementById('gpb').addEventListener('click',()=>{
  const a=lg(AD);const rem=a.filter(g=>!g.done);
  const tom=lg(TD);rem.forEach(g=>tom.push({text:g.text,done:false}));
  const done=a.filter(g=>g.done);sg(AD,done);sg(TD,tom);renderGoals();renderTomorrow()
});

// Supabase sync
const SB_URL='https://cfcwgmxwksvmlqbxbvyz.supabase.co/rest/v1/dashboard_data';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmY3dnbXh3a3N2bWxxYnhidnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNjkzODYsImV4cCI6MjA5NDg0NTM4Nn0.4h1RcYroH0CLRCUbZ0GfewQ1R824hbRxUfa_z5n4oXY';
const sbh={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Accept':'application/json'};
function sbStatus(c,t){const d=document.getElementById('sbDot'),e=document.getElementById('sbText');if(d)d.className='sb-d '+c;if(e)e.textContent=t}
async function sbPush(){
  sbStatus('y','Uploading...');
  const keys=lk('goals:');keys.push('gs');let ok=0,fail=0;
  for(const k of keys){const d=localStorage.getItem(k);if(!d)continue;
    try{const v=JSON.parse(d);if(v&&typeof v==='object'){const r=await fetch(SB_URL,{method:'POST',headers:{...sbh,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})});r.ok?ok++:fail++}}catch{fail++}}
  sbStatus(fail?'r':'g','Sync: '+ok+' up'+(fail?', '+fail+' fail':''))
}
async function sbPull(){
  sbStatus('y','Download...');
  try{const r=await fetch(SB_URL+'?select=key,value',{headers:sbh});
    if(!r.ok){sbStatus('r','Fail '+r.status);return}
    const rows=await r.json();let c=0;
    for(const row of rows){localStorage.setItem(row.key,JSON.stringify(row.value));c++}
    sbStatus('g','+'+(c)+' items');renderGoals();renderTomorrow();renderMinis()
  }catch(e){sbStatus('r','Err: '+e.message)}
}
document.getElementById('sbBtn').addEventListener('click',sbSync);
async function sbSync(){await sbPush();await sbPull()}
sbPull().then(()=>sbStatus('g','Connected')).catch(()=>sbStatus('y','Cloud ready'));
setInterval(()=>sbPull(),30000);

// Alarm
let _alarmDismissed=false;
function checkAlarm(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes();
  const el=document.getElementById('alarmBar');
  if(!el||_alarmDismissed)return;
  if(h===22&&m>=15){el.style.display='flex';if(m>=30&&Notification.permission==='granted')new Notification('Bedtime','{body:"Wind down — bedtime at 11 PM"}' )}
  else if(h===22&&m<15)el.style.display='none';
  else if(h>=23||h<WAKE)el.style.display='flex';
  else el.style.display='none'
}
document.getElementById('alarmDismiss').addEventListener('click',()=>{_alarmDismissed=true;document.getElementById('alarmBar').style.display='none'});
if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();

renderMinis();renderDayRing();renderGoals();renderTomorrow();
setInterval(renderDayRing,60000);setInterval(checkAlarm,10000);checkAlarm()
</script>
