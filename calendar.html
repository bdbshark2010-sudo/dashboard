<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--card-bg:#0a0a0f;--card-border:rgba(110,231,183,.10);--mint:#6ee7b7;--mint-dim:rgba(110,231,183,.45);--amber:#fbbf24;--red:#f87171;--text:#fff;--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.35);--f:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--m:ui-monospace,"SF Mono",Menlo,monospace;--s:rgba(255,255,255,.045);--b:rgba(255,255,255,.08);--c1:#6ee7b7;--c2:#3B82F6;--c3:#00F5FF;--c4:#C084FC;--g:#6ee7b7;--y:#fbbf24;--r:#f87171;--t1:#fff}
html,body{background:var(--bg);color:var(--text);font-family:var(--f);font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:auto}
body{max-width:480px;margin:0 auto;padding:60px 20px 100px}
@keyframes fI{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .6s ease-out backwards}
.divider{display:flex;align-items:center;gap:16px;margin-bottom:20px}.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.10)}.divider span{font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.85);font-weight:500}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;padding:22px 20px;margin-bottom:16px}
.sec-title{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}
/* nav */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--t2);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;transition:all .15s;font-family:var(--f)}
.cal-nav-btn:active{transform:scale(.9)}
.cal-month{font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
/* grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}
.cal-dow{padding:6px 0;text-align:center;font-size:9px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:var(--t3)}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;position:relative;transition:all .15s;min-height:36px;border:1px solid transparent;color:var(--text)}
.cal-day:active{transform:scale(.9)}
.cal-day.other{color:var(--t3)}
.cal-day.today{border-color:rgba(110,231,183,.25);background:rgba(110,231,183,.06)}
.cal-day.has-event{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.12)}
.cal-day.has-due{background:rgba(248,113,113,.06);border-color:rgba(248,113,113,.12)}
.cal-day.today.has-event{border-color:rgba(110,231,183,.25);background:linear-gradient(135deg,rgba(110,231,183,.06),rgba(251,191,36,.06))}
.cal-day.today.has-due{border-color:rgba(110,231,183,.25);background:linear-gradient(135deg,rgba(110,231,183,.06),rgba(248,113,113,.06))}
.cal-day.selected{outline:2px solid var(--mint);outline-offset:-2px}
/* input */
.cal-input-row{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.cal-input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.28);color:var(--text);font-size:14px;outline:none;transition:all .2s;font-family:var(--f)}
.cal-input:focus{border-color:rgba(110,231,183,.3)}
.cal-type-btn{padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--f)}
.cal-type-btn:active{transform:scale(.9)}
.cal-type-btn.a{background:var(--mint);color:#000;border-color:var(--mint);font-weight:700}
.cal-add-btn{background:var(--mint);color:#000;border:none;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;transition:all .15s;font-family:var(--f)}
.cal-add-btn:active{transform:scale(.9)}
/* list */
.cal-list{list-style:none}
.cal-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cal-item:last-child{border-bottom:none}
.cal-item-tag{width:3px;height:auto;min-height:24px;border-radius:2px;flex-shrink:0;margin-top:4px}
.cal-item-tag.event{background:var(--y)}.cal-item-tag.due{background:var(--red)}
.cal-item-text{flex:1;font-size:13px;line-height:1.4;color:var(--text)}
.cal-item-del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:8px;transition:all .15s;opacity:0;font-family:var(--f)}
.cal-item:hover .cal-item-del{opacity:.5}
.cal-item-del:hover{opacity:1!important;color:var(--red);background:rgba(248,113,113,.1)}
.cal-empty{font-size:12px;color:var(--t3);font-style:italic;padding:14px 0;text-align:center}
.cal-selected-date{font-size:13px;color:var(--t2);margin-bottom:12px;font-weight:600}
/* tab bar */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 16px calc(8px+env(safe-area-inset-bottom));pointer-events:none}
.tb-in{pointer-events:auto;display:flex;width:100%;max-width:430px;gap:3px;padding:5px;background:rgba(10,10,13,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;backdrop-filter:blur(30px);box-shadow:0 8px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04)}
.tb-t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.35);text-decoration:none;transition:all .25s}
.tb-t.a{color:#fff;background:rgba(255,255,255,.05);position:relative}
.tb-t.a::after{content:'';position:absolute;top:1px;left:25%;right:25%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--mint),rgba(110,231,183,.4))}
.tb-t-icon{font-size:16px;line-height:1}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script src="js/sync.js"></script>
</head>
<body>

<div class="divider fade" style="animation-delay:0s"><span>&#x1F4C5; CALENDAR</span></div>

<div class="card fade" style="animation-delay:40ms">
<div class="cal-nav">
<button class="cal-nav-btn" id="calPrev">&#x2190;</button>
<div class="cal-month" id="calMonth">—</div>
<button class="cal-nav-btn" id="calNext">&#x2192;</button>
</div>
<div class="cal-grid" id="calGrid"></div>
</div>

<div class="card fade" style="animation-delay:80ms">
<div class="sec-title">Events & Tasks</div>
<div class="cal-selected-date" id="calSelDate">Select a date</div>
<div class="cal-input-row">
<input class="cal-input" id="calInput" placeholder="Add event or task..." autocomplete="off">
<button class="cal-type-btn a" id="calTypeBtn" data-type="event">Event</button>
<button class="cal-type-btn" id="calTypeDue" data-type="due">Due</button>
<button class="cal-add-btn" id="calAddBtn">+</button>
</div>
<ul class="cal-list" id="calList"></ul>
<div class="cal-empty" id="calEmpty">Nothing scheduled for this day.</div>
</div>

<nav class="tb"><div class="tb-in"><a class="tb-t" href="index.html"><span class="tb-t-icon">&#x1F3E0;</span>Home</a><a class="tb-t" href="fitness.html"><span class="tb-t-icon">&#x1F4AA;</span>Fit</a><a class="tb-t a" href="calendar.html"><span class="tb-t-icon">&#x1F4C5;</span>Cal</a><a class="tb-t" href="finance.html"><span class="tb-t-icon">&#x1F4B0;</span>Fin</a><a class="tb-t" href="focus.html"><span class="tb-t-icon">&#x1F3AF;</span>Focus</a><a class="tb-t" href="study.html"><span class="tb-t-icon">&#x1F4DA;</span>Study</a></div></nav>

<script>
(async function(){
function gk(k){return window.syncGet?syncGet(k):(function(){try{var d=localStorage.getItem(k);return d?JSON.parse(d):null}catch{return null}})()}
function sk(k,v){if(window.syncSet)syncSet(k,v);else try{localStorage.setItem(k,JSON.stringify(v))}catch(e){};window.dispatchEvent(new CustomEvent('cal-update'))}
if(window.syncInit)await syncInit();

let cy,cm,selDate;
function td(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function init(){const d=new Date();cy=d.getFullYear();cm=d.getMonth();selDate=td();render()}

function render(){
  document.getElementById('calMonth').textContent=new Date(cy,cm).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dow.forEach(d=>{const e=document.createElement('div');e.className='cal-dow';e.textContent=d;grid.appendChild(e)});

  const first=new Date(cy,cm,1).getDay();
  const days=new Date(cy,cm+1,0).getDate();
  const prevDays=new Date(cy,cm,0).getDate();
  const events=gk('calendar_events')||{};
  const today=td();

  for(let i=first-1;i>=0;i--){
    const d=document.createElement('div');d.className='cal-day other';
    const ds=cy+'-'+String(cm).padStart(2,'0')+'-'+String(prevDays-i).padStart(2,'0');
    d.textContent=prevDays-i;grid.appendChild(d)
  }

  for(let d=1;d<=days;d++){
    const ds=cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const el=document.createElement('div');el.className='cal-day';
    if(ds===today)el.classList.add('today');
    if(ds===selDate)el.classList.add('selected');
    const dayEvents=events[ds];
    if(dayEvents){
      if(dayEvents.some(e=>e.t==='event'))el.classList.add('has-event');
      if(dayEvents.some(e=>e.t==='due'))el.classList.add('has-due');
    }
    el.textContent=d;
    el.dataset.date=ds;
    el.addEventListener('click',()=>{selDate=ds;render();renderDay()});
    grid.appendChild(el)
  }

  const rem=7-(first+days)%7;if(rem<7)for(let i=1;i<rem;i++){const d=document.createElement('div');d.className='cal-day other';d.textContent=i;grid.appendChild(d)}
  renderDay()
}

function renderDay(){
  document.getElementById('calSelDate').textContent=new Date(selDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const events=(gk('calendar_events')||{})[selDate]||[];
  const list=document.getElementById('calList');list.innerHTML='';
  const empty=document.getElementById('calEmpty');
  if(!events.length){empty.style.display='block';return}
  empty.style.display='none';
  events.forEach((e,i)=>{
    const li=document.createElement('li');li.className='cal-item';
    li.style.animation='fI .3s ease '+(i*0.04)+'s both';
    li.innerHTML='<div class="cal-item-tag '+(e.t==='due'?'due':'event')+'"></div><span class="cal-item-text">'+e.text+'<br><span style="font-size:10px;color:var(--t3);font-family:var(--m)">'+e.date+'</span></span><button class="cal-item-del" data-idx="'+i+'">\u00D7</button>';
    li.querySelector('.cal-item-del').addEventListener('click',()=>{
      const all=gk('calendar_events')||{};
      all[selDate].splice(i,1);
      if(!all[selDate].length)delete all[selDate];
      sk('calendar_events',all);renderDay();render()
    });
    list.appendChild(li)
  })
}

document.getElementById('calPrev').addEventListener('click',()=>{cm--;if(cm<0){cm=11;cy--}render()});
document.getElementById('calNext').addEventListener('click',()=>{cm++;if(cm>11){cm=0;cy++}render()});

document.getElementById('calTypeBtn').addEventListener('click',function(){
  document.querySelectorAll('.cal-type-btn').forEach(b=>b.classList.remove('a'));
  this.classList.add('a')
});
document.getElementById('calTypeDue').addEventListener('click',function(){
  document.querySelectorAll('.cal-type-btn').forEach(b=>b.classList.remove('a'));
  this.classList.add('a')
});

document.getElementById('calAddBtn').addEventListener('click',()=>{
  const inp=document.getElementById('calInput'),v=inp.value.trim();
  if(!v)return;
  const type=document.querySelector('.cal-type-btn.a').dataset.type;
  const all=gk('calendar_events')||{};
  if(!all[selDate])all[selDate]=[];
  all[selDate].push({t:type,text:v,date:selDate});
  sk('calendar_events',all);inp.value='';renderDay();render()
});
document.getElementById('calInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('calAddBtn').click()});

init();
})();
</script>
</body>
</html>
