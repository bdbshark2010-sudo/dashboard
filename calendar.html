<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Calendar</title>
<style>
:root{--bg:#000;--s:rgba(255,255,255,.045);--b:rgba(255,255,255,.07);--t1:#F5F4F0;--t2:#B0ADA7;--t3:#6E6B66;--g:#39FF14;--y:#FFD700;--r:#FF0040;--c1:#00FFFF;--c2:#0080FF;--c3:#BF00FF;--c4:#FF006E;--f:-apple-system,BlinkMacSystemFont,"SF Pro","Inter",sans-serif;--m:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--f);display:flex;justify-content:center;padding:20px 14px 88px;min-height:100vh;overflow-x:auto;-webkit-text-size-adjust:100%}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(550px at 70% 15%,rgba(0,255,255,.08) 0%,transparent 70%),radial-gradient(400px at 30% 30%,rgba(255,0,110,.06) 0%,transparent 70%),radial-gradient(450px at 60% 70%,rgba(191,0,255,.05) 0%,transparent 70%);animation:amb 24s ease-in-out infinite alternate}body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px)}
@keyframes amb{0%{transform:translate(0,0)scale(1)}25%{transform:translate(15px,-12px)scale(1.01)}50%{transform:translate(-12px,18px)scale(.99)}75%{transform:translate(8px,-15px)scale(1.02)}100%{transform:translate(-18px,10px)scale(.98)}}
@keyframes fI{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes gp{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
.container{width:100%;max-width:430px;position:relative;z-index:1}

.ht{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;animation:fI .5s ease both}
.ht-l{font-size:25px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--y),var(--r));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ht-r{display:flex;align-items:center;gap:6px;background:var(--s);border:1px solid var(--b);border-radius:12px;padding:6px 12px 6px 8px;font-size:11px;font-weight:600;font-family:var(--m)}
.ht-r-d{width:7px;height:7px;border-radius:50%;animation:gp 2s ease-in-out infinite}

.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--b);border-radius:20px;padding:20px 22px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);animation:fI .5s ease both}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.sec-title{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}

/* nav */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav-btn{background:rgba(255,255,255,.04);border:1px solid var(--b);color:var(--t2);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;transition:all .15s}
.cal-nav-btn:active{transform:scale(.9)}
.cal-month{font-size:16px;font-weight:800;letter-spacing:-.02em}

/* grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}
.cal-dow{padding:6px 0;text-align:center;font-size:9px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--t3)}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;position:relative;transition:all .15s;min-height:36px;border:1px solid transparent}
.cal-day:active{transform:scale(.9)}
.cal-day.other{color:var(--t3)}
.cal-day.today{border-color:rgba(0,245,255,.3);background:rgba(0,245,255,.08);box-shadow:0 0 12px rgba(0,245,255,.1)}
.cal-day.has-event{background:rgba(242,192,99,.08);border-color:rgba(242,192,99,.15)}
.cal-day.has-due{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.15)}
.cal-day.today.has-event{border-color:rgba(0,245,255,.3);background:linear-gradient(135deg,rgba(0,245,255,.08),rgba(242,192,99,.08))}
.cal-day.today.has-due{border-color:rgba(0,245,255,.3);background:linear-gradient(135deg,rgba(0,245,255,.08),rgba(255,107,107,.08))}
.cal-day.selected{outline:2px solid var(--c1);outline-offset:-2px}

/* input */
.cal-input-row{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.cal-input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--b);background:rgba(0,0,0,.28);color:var(--t1);font-size:14px;outline:none;transition:all .2s}
.cal-input:focus{border-color:var(--c1);box-shadow:0 0 16px rgba(0,245,255,.1)}
.cal-type-btn{padding:9px 14px;border-radius:10px;border:1px solid var(--b);background:rgba(255,255,255,.04);color:var(--t2);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;font-family:var(--f)}
.cal-type-btn:active{transform:scale(.9)}
.cal-type-btn.a{background:var(--y);color:#000;border-color:var(--y);font-weight:800}
.cal-add-btn{background:linear-gradient(135deg,var(--c1),var(--g));color:#08080C;border:none;padding:10px 16px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 16px rgba(0,245,255,.15);transition:all .15s}
.cal-add-btn:active{transform:scale(.9)}

/* list */
.cal-list{list-style:none}
.cal-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.cal-item:last-child{border-bottom:none}
.cal-item-tag{width:3px;height:auto;min-height:24px;border-radius:2px;flex-shrink:0;margin-top:4px}
.cal-item-tag.event{background:var(--y);box-shadow:0 0 8px rgba(242,192,99,.3)}
.cal-item-tag.due{background:var(--r);box-shadow:0 0 8px rgba(255,107,107,.3)}
.cal-item-text{flex:1;font-size:13px;line-height:1.4}
.cal-item-del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:8px;transition:all .15s;opacity:0}
.cal-item:hover .cal-item-del{opacity:.5}
.cal-item-del:hover{opacity:1!important;color:var(--r);background:rgba(255,107,107,.1)}
.cal-empty{font-size:12px;color:var(--t3);font-style:italic;padding:14px 0;text-align:center}
.cal-selected-date{font-size:13px;color:var(--t2);margin-bottom:12px;font-weight:700}

/* tab bar */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.tb-in{pointer-events:auto;display:flex;width:100%;max-width:430px;gap:3px;padding:5px;background:rgba(10,10,13,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;backdrop-filter:blur(30px);box-shadow:0 8px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04)}
.tb-t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);text-decoration:none;transition:all .25s cubic-bezier(.22,1,.36,1)}
.tb-t.a{color:var(--t1);background:rgba(255,255,255,.05);position:relative}
.tb-t.a::after{content:'';position:absolute;top:1px;left:25%;right:25%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--c1),var(--c3));animation:fI .3s ease both}
.tb-t-icon{font-size:16px;line-height:1;transition:transform .2s}
.tb-t.a .tb-t-icon{transform:scale(1.1)}
body{padding-bottom:88px}
</style>
</head>
<body>
<div class="container">

<div class="ht">
<div class="ht-l">&#x1F4C5; Calendar</div>
<div class="ht-r"><div class="ht-r-d" id="sbDot" style="background:var(--g)"></div><span id="sbText">Connected</span></div>
</div>

<div class="card" style="animation-delay:0s">
<div class="cal-nav">
<button class="cal-nav-btn" id="calPrev">&#x2190;</button>
<div class="cal-month" id="calMonth">—</div>
<button class="cal-nav-btn" id="calNext">&#x2192;</button>
</div>
<div class="cal-grid" id="calGrid"></div>
</div>

<div class="card" style="animation-delay:.08s">
<div class="sec-title">Events & Tasks</div>
<div class="cal-selected-date" id="calSelDate">Select a date</div>
<div class="cal-input-row">
<input class="cal-input" id="calInput" placeholder="Add event or task..." autocomplete="off">
<button class="cal-type-btn a" id="calTypeBtn" data-type="event">Event</button>
<button class="cal-type-btn" id="calTypeDue" data-type="due">Due</button>
<button class="cal-add-btn" id="calAddBtn">+</button>
</div>
<ul class="cal-list" id="calList"></ul>
<div class="cal-empty" id="calEmpty">Nothing scheduled for this day.</div>
</div>

</div>

<nav class="tb"><div class="tb-in"><a class="tb-t" href="index.html"><span class="tb-t-icon">&#x1F3E0;</span>Home</a><a class="tb-t" href="gym.html"><span class="tb-t-icon">&#x1F3CB;</span>Gym</a><a class="tb-t" href="water.html"><span class="tb-t-icon">&#x1F4A7;</span>Water</a><a class="tb-t" href="sleep.html"><span class="tb-t-icon">&#x1F634;</span>Sleep</a><a class="tb-t a" href="calendar.html"><span class="tb-t-icon">&#x1F4C5;</span>Cal</a><a class="tb-t" href="finance.html"><span class="tb-t-icon">&#x1F4B0;</span>Fin</a><a class="tb-t" href="focus.html"><span class="tb-t-icon">&#x1F3AF;</span>Focus</a></div></nav>

<script>
function gk(k){try{const d=localStorage.getItem(k);return d?JSON.parse(d):null}catch{return null}}
let _sbt;
function sk(k,v){localStorage.setItem(k,JSON.stringify(v));window.dispatchEvent(new CustomEvent('cal-update'));clearTimeout(_sbt);_sbt=setTimeout(sbPush,2000)}

let cy,cm,selDate;
function td(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function init(){const d=new Date();cy=d.getFullYear();cm=d.getMonth();selDate=td();render()}

function render(){
  document.getElementById('calMonth').textContent=new Date(cy,cm).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dow.forEach(d=>{const e=document.createElement('div');e.className='cal-dow';e.textContent=d;grid.appendChild(e)});

  const first=new Date(cy,cm,1).getDay();
  const days=new Date(cy,cm+1,0).getDate();
  const prevDays=new Date(cy,cm,0).getDate();
  const events=gk('calendar_events')||{};
  const today=td();

  for(let i=first-1;i>=0;i--){
    const d=document.createElement('div');d.className='cal-day other';
    const ds=cy+'-'+String(cm).padStart(2,'0')+'-'+String(prevDays-i).padStart(2,'0');
    d.textContent=prevDays-i;grid.appendChild(d)
  }

  for(let d=1;d<=days;d++){
    const ds=cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const el=document.createElement('div');el.className='cal-day';
    if(ds===today)el.classList.add('today');
    if(ds===selDate)el.classList.add('selected');
    const dayEvents=events[ds];
    if(dayEvents){
      if(dayEvents.some(e=>e.t==='event'))el.classList.add('has-event');
      if(dayEvents.some(e=>e.t==='due'))el.classList.add('has-due');
    }
    el.textContent=d;
    el.dataset.date=ds;
    el.addEventListener('click',()=>{selDate=ds;render();renderDay()});
    grid.appendChild(el)
  }

  const rem=7-(first+days)%7;if(rem<7)for(let i=1;i<rem;i++){const d=document.createElement('div');d.className='cal-day other';d.textContent=i;grid.appendChild(d)}
  renderDay()
}

function renderDay(){
  document.getElementById('calSelDate').textContent=new Date(selDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const events=(gk('calendar_events')||{})[selDate]||[];
  const list=document.getElementById('calList');list.innerHTML='';
  const empty=document.getElementById('calEmpty');
  if(!events.length){empty.style.display='block';return}
  empty.style.display='none';
  events.forEach((e,i)=>{
    const li=document.createElement('li');li.className='cal-item';
    li.style.animation='fI .3s ease '+(i*0.04)+'s both';
    li.innerHTML='<div class="cal-item-tag '+(e.t==='due'?'due':'event')+'"></div><span class="cal-item-text">'+e.text+'<br><span style="font-size:10px;color:var(--t3);font-family:var(--m)">'+e.date+'</span></span><button class="cal-item-del" data-idx="'+i+'">\u00D7</button>';
    li.querySelector('.cal-item-del').addEventListener('click',()=>{
      const all=gk('calendar_events')||{};
      all[selDate].splice(i,1);
      if(!all[selDate].length)delete all[selDate];
      sk('calendar_events',all);renderDay();render()
    });
    list.appendChild(li)
  })
}

document.getElementById('calPrev').addEventListener('click',()=>{cm--;if(cm<0){cm=11;cy--}render()});
document.getElementById('calNext').addEventListener('click',()=>{cm++;if(cm>11){cm=0;cy++}render()});

document.getElementById('calTypeBtn').addEventListener('click',function(){
  document.querySelectorAll('.cal-type-btn').forEach(b=>b.classList.remove('a'));
  this.classList.add('a')
});
document.getElementById('calTypeDue').addEventListener('click',function(){
  document.querySelectorAll('.cal-type-btn').forEach(b=>b.classList.remove('a'));
  this.classList.add('a')
});

document.getElementById('calAddBtn').addEventListener('click',()=>{
  const inp=document.getElementById('calInput'),v=inp.value.trim();
  if(!v)return;
  const type=document.querySelector('.cal-type-btn.a').dataset.type;
  const all=gk('calendar_events')||{};
  if(!all[selDate])all[selDate]=[];
  all[selDate].push({t:type,text:v,date:selDate});
  sk('calendar_events',all);inp.value='';renderDay();render()
});
document.getElementById('calInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('calAddBtn').click()});

init();

// Supabase sync
const SB_URL='https://cfcwgmxwksvmlqbxbvyz.supabase.co/rest/v1/dashboard_data';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmY3dnbXh3a3N2bWxxYnhidnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNjkzODYsImV4cCI6MjA5NDg0NTM4Nn0.4h1RcYroH0CLRCUbZ0GfewQ1R824hbRxUfa_z5n4oXY';
const sbh={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Accept':'application/json'};
function sbStatus(dot,text){const de=document.getElementById('sbDot'),te=document.getElementById('sbText');if(de)de.style.background=dot;if(te)te.textContent=text}
async function sbPush(){
  sbStatus('#F2C063','Uploading...');
  const keys=['calendar_events'];let ok=0,fail=0;
  for(const k of keys){
    const d=localStorage.getItem(k);if(!d)continue;
    try{
      const v=JSON.parse(d);if(v&&typeof v==='object'){
        const r=await fetch(SB_URL,{method:'POST',headers:{...sbh,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})});
        r.ok?ok++:fail++
      }
    }catch{fail++}
  }
  sbStatus(fail?'#FF6B6B':'#5CDB95','Sync: '+ok+' up'+(fail?', '+fail+' fail':''));
}
async function sbPull(){
  sbStatus('#F2C063','Download...');
  try{
    const r=await fetch(SB_URL+'?select=key,value',{headers:sbh});
    if(!r.ok){sbStatus('#FF6B6B','DL fail '+r.status);return}
    const rows=await r.json();let c=0;
    for(const row of rows){localStorage.setItem(row.key,JSON.stringify(row.value));c++}
    sbStatus('#5CDB95','DL '+c+' items');renderDay();render()
  }catch(e){sbStatus('#FF6B6B','DL err')}
}
sbPull().then(()=>sbStatus('#5CDB95','Connected')).catch(()=>sbStatus('#F2C063','Cloud ready'));
setInterval(()=>sbPull(),30000);
</script>
</body>
</html>
