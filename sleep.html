<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Sleep Tracker</title>
<style>
:root{--bg:#000;--card-bg:#0a0a0f;--card-border:rgba(110,231,183,0.10);--mint:#6ee7b7;--mint-dim:rgba(110,231,183,0.45);--amber:#fbbf24;--red:#f87171;--text:#fff;--s:rgba(255,255,255,0.045);--b:rgba(255,255,255,0.07);--t1:#fff;--t2:rgba(255,255,255,0.55);--t3:rgba(255,255,255,0.35);--c1:#6ee7b7;--c2:#3B82F6;--c3:#34d399;--g:#6ee7b7;--y:#fbbf24;--r:#f87171;--f:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--m:ui-monospace,'SF Mono',Menlo,monospace;--text-1:#fff;--text-2:rgba(255,255,255,0.55);--text-3:rgba(255,255,255,0.35);--text-4:rgba(255,255,255,0.25);--good:#6ee7b7;--warn:#fbbf24;--bad:#f87171;--info:#3B82F6;--border:rgba(255,255,255,0.10);--border-strong:rgba(255,255,255,0.18);--bg-card:#0a0a0f;--font-mono:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--f);display:flex;justify-content:center;padding:20px 14px 88px;min-height:100vh;overflow-x:auto;-webkit-text-size-adjust:100%}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px at 25% 15%,rgba(110,231,183,.06) 0%,transparent 70%);animation:amb 24s ease-in-out infinite alternate}
@keyframes amb{0%{transform:translate(0,0)scale(1)}25%{transform:translate(20px,-10px)scale(1.01)}50%{transform:translate(-15px,15px)scale(.99)}75%{transform:translate(10px,-20px)scale(1.02)}100%{transform:translate(-15px,8px)scale(.98)}}
@keyframes fI{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes gp{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
.container{width:100%;max-width:430px;position:relative;z-index:1}

/* header */
.ht{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;animation:fI .5s ease both}
.ht-l{font-size:25px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ht-r{display:flex;align-items:center;gap:6px;background:var(--s);border:1px solid var(--b);border-radius:12px;padding:6px 12px 6px 8px;font-size:11px;font-weight:600;font-family:var(--m)}
.ht-r-d{width:7px;height:7px;border-radius:50%;animation:gp 2s ease-in-out infinite}

/* card */
.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--b);border-radius:20px;padding:20px 22px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);animation:fI .5s ease both}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.sec-title{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}

/* sleep input */
.st-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.st-field{flex:1;min-width:130px}
.st-field label{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.st-field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--b);background:rgba(0,0,0,.28);color:var(--t1);font-family:var(--m);font-size:16px;font-weight:600;outline:none;transition:all .2s}
.st-field input:focus{border-color:var(--c1);box-shadow:0 0 16px rgba(0,245,255,.1)}
.st-btn{background:linear-gradient(135deg,var(--c1),var(--g));color:#08080C;border:none;padding:14px 28px;border-radius:14px;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(0,245,255,.2)}
.st-btn:active{transform:scale(.93)}
.st-today{font-size:12px;color:var(--t2);margin-bottom:14px;font-family:var(--m);font-variant-numeric:tabular-nums}

/* week */
.st-week{display:flex;gap:4px}
.st-day{flex:1;padding:12px 4px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--b);text-align:center;animation:fI .3s ease both}
.st-day-name{font-size:8px;color:var(--t3);text-transform:uppercase;font-weight:700;letter-spacing:.08em;margin-bottom:4px}
.st-day-hrs{font-size:15px;font-weight:800;font-family:var(--m)}
.st-day-empty{color:var(--t3);font-size:10px}

/* stats */
.st-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.st-stat-box{background:rgba(255,255,255,.03);border:1px solid var(--b);border-radius:14px;padding:16px 8px;text-align:center;animation:fI .3s ease both;box-shadow:0 4px 16px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.04)}
.st-stat-num{font-size:28px;font-weight:800;font-family:var(--m);font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.st-stat-label{font-size:9px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--t3);margin-top:4px}

/* history */
.st-history{list-style:none}
.st-hist-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;font-family:var(--m);font-variant-numeric:tabular-nums;animation:fI .3s ease both}
.st-hist-row:last-child{border-bottom:none}
.st-hist-date{color:var(--t3)}
.st-hist-dur{font-weight:800}
.st-hist-ok{color:var(--c1);text-shadow:0 0 10px rgba(0,245,255,.3)}
.st-hist-low{color:var(--r)}

/* tab bar */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.tb-in{pointer-events:auto;display:flex;width:100%;max-width:430px;gap:3px;padding:5px;background:rgba(10,10,13,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;backdrop-filter:blur(30px);box-shadow:0 8px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04)}
.tb-t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);text-decoration:none;transition:all .25s cubic-bezier(.22,1,.36,1)}
.tb-t.a{color:var(--t1);background:rgba(255,255,255,.05);position:relative}
.tb-t.a::after{content:'';position:absolute;top:1px;left:25%;right:25%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--c1),var(--c3));animation:fI .3s ease both}
.tb-t-icon{font-size:16px;line-height:1;transition:transform .2s}
.tb-t.a .tb-t-icon{transform:scale(1.1)}
body{padding-bottom:88px}
</style>
<script src="js/sync.js"></script>
</head>
<body>
<div class="container">

<div class="ht">
<div class="ht-l">&#x1F634; Sleep</div>
<div class="ht-r"><div class="ht-r-d" id="sbDot" style="background:var(--g)"></div><span id="sbText">Connected</span></div>
</div>

<div class="card" style="animation-delay:0s">
<div class="st-today" id="stToday">Today —</div>
<div class="st-row">
<div class="st-field"><label>&#x1F319; Bed time</label><input type="time" id="stBed"></div>
<div class="st-field"><label>&#x2600; Wake time</label><input type="time" id="stWake"></div>
</div>
<button class="st-btn" id="stSave">&#x1F4BE; Log Sleep</button>
</div>

<div class="card" style="animation-delay:.05s">
<div class="sec-title">This Week</div>
<div class="st-week" id="stWeek"></div>
</div>

<div class="card" style="animation-delay:.1s">
<div class="sec-title">Stats</div>
<div class="st-stat">
<div class="st-stat-box"><div class="st-stat-num" id="stAvg">—</div><div class="st-stat-label">Avg hrs</div></div>
<div class="st-stat-box"><div class="st-stat-num" id="stStr">—</div><div class="st-stat-label">Streak days</div></div>
<div class="st-stat-box"><div class="st-stat-num" id="stGoal">—</div><div class="st-stat-label">Goal hit %</div></div>
</div>
</div>

<div class="card" style="animation-delay:.15s">
<div class="sec-title">History</div>
<ul class="st-history" id="stHist"></ul>
</div>

</div>

<nav class="tb"><div class="tb-in"><a class="tb-t" href="index.html"><span class="tb-t-icon">&#x1F3E0;</span>Home</a><a class="tb-t a" href="fitness.html"><span class="tb-t-icon">&#x1F4AA;</span>Fit</a><a class="tb-t" href="calendar.html"><span class="tb-t-icon">&#x1F4C5;</span>Cal</a><a class="tb-t" href="finance.html"><span class="tb-t-icon">&#x1F4B0;</span>Fin</a><a class="tb-t" href="focus.html"><span class="tb-t-icon">&#x1F3AF;</span>Focus</a><a class="tb-t" href="study.html"><span class="tb-t-icon">&#x1F4DA;</span>Study</a></div></nav>

<script>
const TARGET=8;
function gk(k){return window.syncGet?syncGet(k):(function(){try{var d=localStorage.getItem(k);return d?JSON.parse(d):null}catch{return null}})()}
function sk(k,v){if(window.syncSet)syncSet(k,v);else try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function td(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){const p=d.split('-');const dt=new Date(p[0],p[1]-1,p[2]);return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function calcHrs(b,w){
  const bp=b.split(':').map(Number),wp=w.split(':').map(Number);
  let h=wp[0]-bp[0],m=wp[1]-bp[1];
  if(h<0||(h===0&&m<0))h+=24;
  return +(h+m/60).toFixed(1)
}

function render(){
  const d=td();
  document.getElementById('stToday').textContent='Today \u2014 '+fmt(d);
  const log=gk('sleep_log')||{};
  const entries=Object.entries(log).sort((a,b)=>b[0].localeCompare(a[0]));
  const week=[],today=new Date();
  for(let i=6;i>=0;i--){const d2=new Date(today);d2.setDate(d2.getDate()-i);week.push(d2.toISOString().slice(0,10))}
  const wEl=document.getElementById('stWeek');wEl.innerHTML='';
  let total=0,count=0,goalHit=0;
  for(const d2 of week){
    const day=document.createElement('div');day.className='st-day';
    const dn=document.createElement('div');dn.className='st-day-name';
    dn.textContent=new Date(d2+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    day.appendChild(dn);
    const hv=document.createElement('div');
    if(log[d2]){
      const h=calcHrs(log[d2].bed,log[d2].wake);
      total+=h;count++;
      if(h>=TARGET)goalHit++;
      hv.className='st-day-hrs';hv.textContent=h+'h';hv.style.color=h>=TARGET?'var(--c1)':'var(--r)'
    }else{hv.className='st-day-empty';hv.textContent='\u2014'}
    day.appendChild(hv);wEl.appendChild(day)
  }
  document.getElementById('stAvg').textContent=count?+(total/count).toFixed(1):'\u2014';
  document.getElementById('stStr').textContent='\u2014';
  document.getElementById('stGoal').textContent=count?Math.round(goalHit/count*100)+'%':'\u2014';

  const hEl=document.getElementById('stHist');hEl.innerHTML='';
  for(const[k,v]of entries.slice(0,14)){
    const r=document.createElement('li');r.className='st-hist-row';
    const h=calcHrs(v.bed,v.wake);
    r.innerHTML='<span class="st-hist-date">'+fmt(k)+'</span><span>'+v.bed+' \u2013 '+v.wake+'</span><span class="st-hist-dur '+(h>=TARGET?'st-hist-ok':'st-hist-low')+'">'+h+'h</span>';
    hEl.appendChild(r)
  }
}

document.getElementById('stSave').addEventListener('click',()=>{
  const b=document.getElementById('stBed').value,w=document.getElementById('stWake').value;
  if(!b||!w){alert('Enter both bed and wake times');return}
  const log=gk('sleep_log')||{};log[td()]={bed:b,wake:w};sk('sleep_log',log);
  document.getElementById('stBed').value='';document.getElementById('stWake').value='';
  render()
});

if(window.syncInit)syncInit();
render();


</script>
</body>
</html>
